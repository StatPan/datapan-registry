            if [ "${INPUT_EXPIRED}" = "true" ]; then
              args+=(--input-error input_expired)
            else
              args+=(--input-error artifact_missing)
            fi
          else
            args+=(--claim-only)
            if [ -f .datapan/ci/upstream-refresh/candidate.registry.json ]; then
              args+=(--candidate .datapan/ci/upstream-refresh/candidate.registry.json)
            fi
            if [ -f .datapan/ci/upstream-refresh/catalog-diff.json ]; then
              args+=(--diff .datapan/ci/upstream-refresh/catalog-diff.json)
            fi
            if [ -f .datapan/ci/upstream-refresh/upstream-refresh-evidence.json ]; then
              args+=(--refresh-evidence .datapan/ci/upstream-refresh/upstream-refresh-evidence.json)
            fi
            if [ -n "${INPUT_ERROR}" ]; then args+=(--input-error "${INPUT_ERROR}"); fi
            if [ -n "${RESUME_EVIDENCE}" ] && [ -f "${RESUME_EVIDENCE}" ]; then
