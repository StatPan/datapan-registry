name: Process upstream catalogue

on:
  workflow_run:
    workflows: ["Upstream catalog refresh"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - policy/source-refresh.json
      - data/provider-index.json
      - .github/workflows/upstream-catalog-refresh.yml
      - schemas/datapan.provider-index.v1.schema.json
      - schemas/datapan.upstream-refresh-evidence.v1.schema.json
      - scripts/process-upstream-catalogue-candidate.py
      - scripts/generate-batch-link-detail-registry-patches.py
      - scripts/upstream-catalogue-state-branch.py
      - scripts/upstream_catalogue_handoff.py
      - scripts/upstream_catalogue_derivation.py
      - scripts/upstream_catalogue_cache_source.py
      - scripts/prepare-upstream-catalogue-derivation.py
      - scripts/upstream_catalogue_source_eligibility.py
      - scripts/seoul_oa109_operation_declaration.py
      - scripts/generate-seoul-oa109-subject-snapshot.py
      - scripts/compose-upstream-catalogue-candidate.py
      - contracts/provider-operation-declarations/data-go-kr-15056854-oa-109-search-last-train-time.v1.json
      - contracts/provider-operation-declarations/data-go-kr-15056854-historical-subject-0085.v1.json
      - .github/workflows/upstream-catalogue-process.yml
      - schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json
      - schemas/datapan.catalogue-composition-receipt.v1.schema.json
      - schemas/datapan.specs.v1.schema.json
      - schemas/datapan.catalog-diff.v1.schema.json
      - schemas/datapan.catalogue-enrichment-evidence.v1.schema.json
      - schemas/datapan.upstream-catalogue-source-eligibility.v1.schema.json
      - .github/workflows/canonical-update-promotion.yml
      - .github/workflows/upstream-catalogue-health.yml
      - scripts/run-canonical-update-promotion.py
      - scripts/canonical_current_target_evidence.py
      - scripts/canonical_source_target_disposition.py
      - scripts/canonical_update_pr.py
      - scripts/canonical_update_ci.py
      - scripts/refresh-canonical-snapshot-evidence.py
      - scripts/materialize-canonical-registry.py
      - scripts/check-upstream-catalogue-health.py
      - scripts/persist-upstream-catalogue-health.py
      - scripts/prepare-upstream-catalogue-health-state-worktree.sh
      - scripts/canonical_update_terminal_evidence.py
      - schemas/datapan.canonical-update-promotion-terminal-outcome.v1.schema.json
      - schemas/datapan.canonical-update-promotion-terminal-outcome.v2.schema.json
      - schemas/datapan.canonical-update-promotion-journal.v1.schema.json
      - schemas/datapan.canonical-update-promotion-receipt.v1.schema.json
      - schemas/datapan.upstream-catalogue-health-policy.v1.schema.json
      - schemas/datapan.upstream-catalogue-health-state-owner.v1.schema.json
      - schemas/datapan.upstream-catalogue-health-state.v1.schema.json
      - schemas/datapan.upstream-catalogue-health.v1.schema.json
      - policy/upstream-catalogue-health.json
  schedule:
    # Continue one bounded batch from the oldest active generation each hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Resume a trusted successful Upstream catalog refresh run
        required: false
        type: string
      recover_failed_processor_run_id:
        description: Safely terminalize an exact failed processor generation after its lease expires
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-catalogue-processing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  process:
    name: Process
    if: >-
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch)) &&
      (github.event_name != 'push' ||
        (github.event.repository.full_name == github.repository &&
         github.event.deleted == false &&
         github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
         github.sha == github.event.after)) &&
      (github.event_name != 'workflow_dispatch' ||
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      processing_status: ${{ steps.publish_result.outputs.status }}
      generation_id: ${{ steps.publish_result.outputs.generation_id }}
      processing_artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
      processing_artifact_name: ${{ steps.publish_result.outputs.artifact_name }}
      state_publication_status: ${{ steps.publish_result.outputs.state_publication_status }}
      processing_replay: ${{ steps.bundle_check.outputs.replay }}
      candidate_available: ${{ steps.bundle_check.outputs.candidate_available }}
      producer_head_sha: ${{ steps.producer.outputs.head_sha }}
      processor_head_sha: ${{ steps.processor_revision.outputs.head_sha }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          path: bootstrap
          lfs: false
          # The derivation guard verifies that the acknowledged C merge is an
          # ancestor of this exact main revision.
          fetch-depth: 0

      - name: Record trusted processor revision
        id: processor_revision
        working-directory: bootstrap
        run: echo "head_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Setup Python for local source selectors
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source selection dependencies
        working-directory: bootstrap
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'PyYAML==6.0.2'

      - name: Prepare and validate isolated state worktree
        id: state
        working-directory: bootstrap
        env:
          STATE_BRANCH: automation/upstream-catalogue-state
        run: |
          set -euo pipefail
          python3 scripts/upstream-catalogue-state-branch.py prepare \
            --source-repo . --worktree ../state-repo --remote origin \
            --branch "${STATE_BRANCH}" --repository "${GITHUB_REPOSITORY}" \
            --result .datapan/ci/upstream-catalogue-state-context.json
          jq -r '"old_sha=" + .old_sha' .datapan/ci/upstream-catalogue-state-context.json >> "${GITHUB_OUTPUT}"
          echo "state_dir=../state-repo/.datapan/upstream-catalogue-state" >> "${GITHUB_OUTPUT}"

      - name: Discover missed trusted collector handoff before scheduled detail continuation
        id: handoff
        if: github.event_name == 'schedule'
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
        run: |
          set -euo pipefail
          python3 scripts/upstream_catalogue_handoff.py \
            --repository "${REPOSITORY}" --default-branch "${DEFAULT_BRANCH}" \
            --state-dir "${STATE_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Select bounded retained source-contract work
        id: source_recovery
        if: github.event_name == 'push' || github.event_name == 'schedule'
        working-directory: bootstrap
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ steps.processor_revision.outputs.head_sha }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          SELECTION_STATE_SHA: ${{ steps.state.outputs.old_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/upstream_catalogue_source_eligibility.py \
            --root . --state-dir "${STATE_DIR}" --repository "${REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" --event "${EVENT_NAME}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --selection-state-sha "${SELECTION_STATE_SHA}" \
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output .datapan/ci/source-work-request.json \
            --github-output "${GITHUB_OUTPUT}" --include-active

      - name: Select producer observation or oldest active generation
        id: select
        working-directory: bootstrap
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_PRODUCER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INPUT_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          INPUT_RECOVER_FAILED_PROCESSOR_RUN_ID: ${{ inputs.recover_failed_processor_run_id }}
          HANDOFF_AVAILABLE: ${{ steps.handoff.outputs.available }}
          HANDOFF_PRODUCER_RUN_ID: ${{ steps.handoff.outputs.producer_run_id }}
          HANDOFF_PRODUCER_HEAD_SHA: ${{ steps.handoff.outputs.head_sha }}
          HANDOFF_RUN_ATTEMPT: ${{ steps.handoff.outputs.run_attempt }}
          HANDOFF_RUN_STARTED_AT: ${{ steps.handoff.outputs.run_started_at }}
          HANDOFF_ARTIFACT_ID: ${{ steps.handoff.outputs.artifact_id }}
          HANDOFF_ARTIFACT_NAME: ${{ steps.handoff.outputs.artifact_name }}
          HANDOFF_ARTIFACT_EXPIRES_AT: ${{ steps.handoff.outputs.artifact_expires_at }}
          HANDOFF_ARTIFACT_DIGEST: ${{ steps.handoff.outputs.artifact_digest_sha256 }}
          HANDOFF_ARTIFACT_SIZE: ${{ steps.handoff.outputs.artifact_size_bytes }}
          SOURCE_RECOVERY_ACTION: ${{ steps.source_recovery.outputs.action }}
          SOURCE_RECOVERY_REASON: ${{ steps.source_recovery.outputs.reason_code }}
          SOURCE_RECOVERY_GENERATION_ID: ${{ steps.source_recovery.outputs.selected_generation_id }}
          SOURCE_RECOVERY_PRODUCER_RUN_ID: ${{ steps.source_recovery.outputs.producer_run_id }}
          SOURCE_RECOVERY_ARTIFACT_ID: ${{ steps.source_recovery.outputs.artifact_id }}
          SOURCE_RECOVERY_ARTIFACT_NAME: ${{ steps.source_recovery.outputs.artifact_name }}
          SOURCE_RECOVERY_REQUEST_PATH: ${{ steps.source_recovery.outputs.request_path }}
          SOURCE_RECOVERY_OUTCOME: ${{ steps.source_recovery.outcome }}
          REPOSITORY: ${{ github.repository }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
        run: |
          set -euo pipefail
          if { [ "${EVENT_NAME}" = "push" ] || [ "${EVENT_NAME}" = "schedule" ]; } && \
            [ "${SOURCE_RECOVERY_OUTCOME:-success}" != "success" ]; then
            echo "FAIL retained source selector did not complete" >&2
            exit 2
          fi
          find_prior_generation() {
            python3 - "${STATE_DIR}" "$1" <<'PY'
          import hashlib
          import datetime as dt
          import json
          import pathlib
          import re
          import sys

          sys.path.insert(0, str(pathlib.Path.cwd() / "scripts"))
          import upstream_catalogue_derivation as derivation
          import upstream_catalogue_source_eligibility as source_eligibility

          state = pathlib.Path(sys.argv[1])
          producer_id = sys.argv[2]
          index_path = state / "sources/data_go_kr/index.json"
          if not index_path.is_file():
              print("\t\t")
              raise SystemExit(0)
          index = json.loads(index_path.read_text(encoding="utf-8"))
          if index.get("schema_version") != "datapan.upstream-catalogue-checkpoint.v1" or not isinstance(index.get("generations"), list):
              raise SystemExit("FAIL corrupt state index while resolving producer redelivery")
          shadowed = set()
          for indexed in index["generations"]:
              if not isinstance(indexed, dict) or not isinstance(indexed.get("generation_id"), str):
                  continue
              parent_id = indexed["generation_id"]
              if not re.fullmatch(r"[a-f0-9]{64}", parent_id):
                  raise SystemExit("FAIL invalid generation id while resolving derivation lineage")
              parent_path = state / "sources/data_go_kr/generations" / f"{parent_id}.json"
              if not parent_path.is_file():
                  continue
              parent = json.loads(parent_path.read_text(encoding="utf-8"))
              unsigned = dict(parent)
              claimed = unsigned.pop("checkpoint_sha256", None)
              canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              if hashlib.sha256(canonical).hexdigest() != claimed or parent.get("generation_id") != parent_id:
                  raise SystemExit("FAIL corrupt checkpoint while resolving derivation lineage")
              inputs = parent.get("generation_inputs") if isinstance(parent.get("generation_inputs"), dict) else {}
              envelope = inputs.get("same_observation_derivation")
              if envelope is not None:
                  try:
                      shadowed.update(derivation.validate_derivation_envelope(envelope)["ancestor_generation_ids"])
                  except (TypeError, ValueError) as exc:
                      raise SystemExit("FAIL invalid derivation envelope while resolving producer redelivery") from exc
              source_epoch = inputs.get("source_epoch")
              if source_epoch is not None:
                  try:
                      shadowed.add(source_eligibility.validate_source_epoch(source_epoch)["predecessor_generation_id"])
                  except (TypeError, ValueError) as exc:
                      raise SystemExit("FAIL invalid source epoch while resolving producer redelivery") from exc
          artifact_name = f"upstream-catalog-refresh-{producer_id}"
          matches = []
          for row in index["generations"]:
              if not isinstance(row, dict) or not isinstance(row.get("generation_id"), str):
                  continue
              generation_id = row["generation_id"]
              if generation_id in shadowed:
                  continue
              if not re.fullmatch(r"[a-f0-9]{64}", generation_id):
                  raise SystemExit("FAIL invalid generation id while resolving producer redelivery")
              path = state / "sources/data_go_kr/generations" / f"{generation_id}.json"
              if not path.is_file():
                  continue
              checkpoint = json.loads(path.read_text(encoding="utf-8"))
              unsigned = dict(checkpoint)
              claimed = unsigned.pop("checkpoint_sha256", None)
              canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              if hashlib.sha256(canonical).hexdigest() != claimed or checkpoint.get("generation_id") != generation_id:
                  raise SystemExit("FAIL corrupt generation checkpoint while resolving producer redelivery")
              if checkpoint.get("source_id") != "data_go_kr" or checkpoint.get("status") not in {"queued", "retry", "enriching", "composing", "ready", "no-change"}:
                  continue
              observation = checkpoint.get("last_observation") if isinstance(checkpoint.get("last_observation"), dict) else {}
              if str(observation.get("producer_run_id") or "") != producer_id:
                  continue
              refs = checkpoint.get("input_artifacts")
              if not isinstance(refs, list):
                  continue
              exact = [ref for ref in refs if isinstance(ref, dict) and ref.get("run_id") == producer_id and ref.get("name") == artifact_name]
              if len(exact) > 1:
                  raise SystemExit("FAIL duplicate source artifact locator in generation checkpoint")
              if not exact:
                  continue
              ref = exact[0]
              if not re.fullmatch(r"[a-f0-9]{64}", str(ref.get("candidate_sha256") or "")):
                  continue
              artifact_id = str(ref.get("artifact_id") or "")
              expires_at = str(ref.get("expires_at") or "")
              if not artifact_id.isdigit() or not re.fullmatch(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)", expires_at):
                  raise SystemExit("FAIL existing producer generation has an invalid source artifact locator")
              matches.append((generation_id, artifact_id, expires_at))
          if len(matches) > 1:
              raise SystemExit("FAIL producer delivery maps to multiple catalogue generations")
          print("\t".join(matches[0]) if matches else "\t\t")
          PY
          }
          if [ "${EVENT_NAME}" = "push" ]; then
            if [ "${SOURCE_RECOVERY_ACTION}" = "rebuild" ] || [ "${SOURCE_RECOVERY_ACTION}" = "resume" ]; then
              [[ "${SOURCE_RECOVERY_PRODUCER_RUN_ID}" =~ ^[0-9]+$ ]]
              [[ "${SOURCE_RECOVERY_GENERATION_ID}" =~ ^[a-f0-9]{64}$ ]]
              source_work_request=""
              if [ "${SOURCE_RECOVERY_ACTION}" = "rebuild" ]; then
                source_work_request="${SOURCE_RECOVERY_REQUEST_PATH}"
              fi
              {
                echo "decision=process"
                echo "producer_run_id=${SOURCE_RECOVERY_PRODUCER_RUN_ID}"
                echo "producer_head_sha="
                echo "generation_id=${SOURCE_RECOVERY_GENERATION_ID}"
                echo "expected_input_artifact_id=${SOURCE_RECOVERY_ARTIFACT_ID}"
                echo "expected_input_expires_at="
                echo "expected_input_name=${SOURCE_RECOVERY_ARTIFACT_NAME}"
                echo "source_work_request=${source_work_request}"
              } >> "${GITHUB_OUTPUT}"
            else
              {
                echo "decision=idle"
                echo "idle_reason=${SOURCE_RECOVERY_REASON:-no_retained_source_work}"
                echo "source_work_request=${SOURCE_RECOVERY_REQUEST_PATH}"
              } >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_RECOVER_FAILED_PROCESSOR_RUN_ID}" ]; then
            if [ -n "${INPUT_PRODUCER_RUN_ID}" ]; then
              echo "FAIL producer_run_id and recover_failed_processor_run_id are mutually exclusive" >&2
              exit 1
            fi
            [[ "${INPUT_RECOVER_FAILED_PROCESSOR_RUN_ID}" =~ ^[0-9]+$ ]]
          python3 - "${STATE_DIR}" "${INPUT_RECOVER_FAILED_PROCESSOR_RUN_ID}" <<'PY' >> "${GITHUB_OUTPUT}"
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import re
          import sys

          state = pathlib.Path(sys.argv[1])
          failed_run_id = sys.argv[2]
          index_path = state / "sources/data_go_kr/index.json"
          if not index_path.is_file():
              raise SystemExit("FAIL recovery target has no durable source index")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          if index.get("schema_version") != "datapan.upstream-catalogue-checkpoint.v1" or not isinstance(index.get("generations"), list):
              raise SystemExit("FAIL corrupt source index while selecting recovery target")
          matches = []
          for row in index["generations"]:
              if not isinstance(row, dict) or not isinstance(row.get("generation_id"), str):
                  continue
              generation_id = row["generation_id"]
              if not re.fullmatch(r"[a-f0-9]{64}", generation_id):
                  raise SystemExit("FAIL invalid generation id while selecting recovery target")
              path = state / "sources/data_go_kr/generations" / f"{generation_id}.json"
              if not path.is_file():
                  continue
              checkpoint = json.loads(path.read_text(encoding="utf-8"))
              unsigned = dict(checkpoint)
              claimed = unsigned.pop("checkpoint_sha256", None)
              canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              if hashlib.sha256(canonical).hexdigest() != claimed or checkpoint.get("generation_id") != generation_id:
                  raise SystemExit("FAIL corrupt generation checkpoint while selecting recovery target")
              locator = checkpoint.get("output_artifact") if isinstance(checkpoint.get("output_artifact"), dict) else {}
              name = str(locator.get("name") or "")
              match = re.fullmatch(r"upstream-catalogue-processing-([0-9]+)-([0-9]+)", name)
              if (
                  str(locator.get("run_id") or "") == failed_run_id
                  and match is not None and match.group(1) == failed_run_id
              ):
                  matches.append((checkpoint, int(match.group(2))))
          if len(matches) != 1:
              raise SystemExit("FAIL recovery run must identify exactly one durable generation")
          checkpoint, old_attempt = matches[0]
          lease = checkpoint.get("lease") if isinstance(checkpoint.get("lease"), dict) else {}
          locator = checkpoint.get("output_artifact") if isinstance(checkpoint.get("output_artifact"), dict) else {}
          reservation = checkpoint.get("request_reservation") if isinstance(checkpoint.get("request_reservation"), dict) else {}
          try:
              lease_expiry = dt.datetime.fromisoformat(str(lease.get("expires_at", "")).replace("Z", "+00:00"))
          except ValueError as exc:
              raise SystemExit("FAIL recovery target lease expiry is invalid") from exc
          if lease_expiry.tzinfo is None or lease_expiry > dt.datetime.now(dt.timezone.utc):
              raise SystemExit("FAIL recovery target lease is still active")
          if (
              checkpoint.get("source_id") != "data_go_kr"
              or checkpoint.get("status") not in {"enriching", "composing", "retry"}
              or lease.get("owner_run_id") != f"{failed_run_id}-{old_attempt}"
              or lease.get("fencing_token") != checkpoint.get("fencing_token")
              or reservation.get("owner_run_id") != lease.get("owner_run_id")
              or reservation.get("generation_id") != checkpoint.get("generation_id")
              or locator.get("artifact_id") is not None
              or locator.get("bundle_manifest_sha256") is not None
          ):
              raise SystemExit("FAIL recovery target is not an active source generation")
          observation = checkpoint.get("last_observation") if isinstance(checkpoint.get("last_observation"), dict) else {}
          producer_run_id = str(observation.get("producer_run_id") or "")
          if not producer_run_id.isdigit():
              raise SystemExit("FAIL recovery target lacks its immutable producer run id")
          print("decision=recover")
          print(f"producer_run_id={producer_run_id}")
          print(f"generation_id={checkpoint['generation_id']}")
          print(f"recover_failed_run_id={failed_run_id}")
          print(f"recover_failed_attempt={old_attempt}")
          print(f"expected_checkpoint_sha256={checkpoint['checkpoint_sha256']}")
          PY
            exit 0
          fi
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            [[ "${EVENT_PRODUCER_RUN_ID}" =~ ^[0-9]+$ ]]
            [[ "${EVENT_PRODUCER_HEAD_SHA}" =~ ^[a-f0-9]{40}$ ]]
            prior="$(find_prior_generation "${EVENT_PRODUCER_RUN_ID}")"
            IFS=$'\t' read -r generation_id expected_artifact_id expected_expires_at <<< "${prior}"
            {
              echo "decision=process"
              echo "producer_run_id=${EVENT_PRODUCER_RUN_ID}"
              echo "producer_head_sha=${EVENT_PRODUCER_HEAD_SHA}"
              echo "generation_id=${generation_id}"
              [[ "${EVENT_PRODUCER_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
              echo "expected_producer_attempt=${EVENT_PRODUCER_RUN_ATTEMPT}"
              echo "expected_input_artifact_id="
              echo "expected_input_expires_at="
              echo "expected_input_name=upstream-catalog-refresh-${EVENT_PRODUCER_RUN_ID}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_PRODUCER_RUN_ID}" ]; then
            [[ "${INPUT_PRODUCER_RUN_ID}" =~ ^[0-9]+$ ]]
            prior="$(find_prior_generation "${INPUT_PRODUCER_RUN_ID}")"
            IFS=$'\t' read -r generation_id expected_artifact_id expected_expires_at <<< "${prior}"
            {
              echo "decision=process"
              echo "producer_run_id=${INPUT_PRODUCER_RUN_ID}"
              echo "producer_head_sha="
              echo "generation_id=${generation_id}"
              echo "expected_input_artifact_id="
              echo "expected_input_expires_at="
              echo "expected_input_name=upstream-catalog-refresh-${INPUT_PRODUCER_RUN_ID}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "schedule" ] && [ "${HANDOFF_AVAILABLE}" = "true" ]; then
            [[ "${HANDOFF_PRODUCER_RUN_ID}" =~ ^[0-9]+$ ]]
            [[ "${HANDOFF_PRODUCER_HEAD_SHA}" =~ ^[a-f0-9]{40}$ ]]
            [[ "${HANDOFF_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
            [[ "${HANDOFF_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
            [[ "${HANDOFF_ARTIFACT_DIGEST}" =~ ^[a-f0-9]{64}$ ]]
            [[ "${HANDOFF_ARTIFACT_SIZE}" =~ ^[1-9][0-9]*$ ]]
            {
              echo "decision=process"
              echo "producer_run_id=${HANDOFF_PRODUCER_RUN_ID}"
              echo "producer_head_sha=${HANDOFF_PRODUCER_HEAD_SHA}"
              echo "generation_id="
              echo "expected_input_artifact_id=${HANDOFF_ARTIFACT_ID}"
              echo "expected_input_expires_at=${HANDOFF_ARTIFACT_EXPIRES_AT}"
              echo "expected_input_name=${HANDOFF_ARTIFACT_NAME}"
              echo "expected_input_digest=${HANDOFF_ARTIFACT_DIGEST}"
              echo "expected_input_size=${HANDOFF_ARTIFACT_SIZE}"
              echo "expected_producer_attempt=${HANDOFF_RUN_ATTEMPT}"
              echo "expected_producer_started_at=${HANDOFF_RUN_STARTED_AT}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import hashlib
          import json
          import os
          import pathlib
          import re
          import sys

          sys.path.insert(0, str(pathlib.Path.cwd() / "scripts"))
          import upstream_catalogue_derivation as derivation
          import upstream_catalogue_source_eligibility as source_eligibility

          state = pathlib.Path(os.environ["STATE_DIR"])
          index_path = state / "sources/data_go_kr/index.json"
          if not index_path.is_file():
              print("decision=idle")
              print("idle_reason=no_active_generation")
              raise SystemExit(0)
          index = json.loads(index_path.read_text(encoding="utf-8"))
          rows = index.get("generations")
          if index.get("schema_version") != "datapan.upstream-catalogue-checkpoint.v1" or not isinstance(rows, list):
              raise SystemExit("FAIL corrupt upstream catalogue state index")
          schema_path = pathlib.Path("schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          del schema  # The source processor revalidates the complete schema before use.
          candidates = []
          shadowed = set()
          for indexed in rows:
              if not isinstance(indexed, dict) or not isinstance(indexed.get("generation_id"), str):
                  continue
              parent_id = indexed["generation_id"]
              if not re.fullmatch(r"[a-f0-9]{64}", parent_id):
                  raise SystemExit("FAIL invalid generation id in derivation lineage")
              parent_path = state / "sources/data_go_kr/generations" / f"{parent_id}.json"
              if not parent_path.is_file():
                  continue
              parent = json.loads(parent_path.read_text(encoding="utf-8"))
              unsigned = dict(parent)
              claimed = unsigned.pop("checkpoint_sha256", None)
              canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              if hashlib.sha256(canonical).hexdigest() != claimed or parent.get("generation_id") != parent_id:
                  raise SystemExit("FAIL corrupt checkpoint in derivation lineage")
              inputs = parent.get("generation_inputs") if isinstance(parent.get("generation_inputs"), dict) else {}
              envelope = inputs.get("same_observation_derivation")
              if envelope is not None:
                  try:
                      shadowed.update(derivation.validate_derivation_envelope(envelope)["ancestor_generation_ids"])
                  except (TypeError, ValueError) as exc:
                      raise SystemExit("FAIL invalid derivation envelope in checkpoint") from exc
              source_epoch = inputs.get("source_epoch")
              if source_epoch is not None:
                  try:
                      shadowed.add(source_eligibility.validate_source_epoch(source_epoch)["predecessor_generation_id"])
                  except (TypeError, ValueError) as exc:
                      raise SystemExit("FAIL invalid source epoch in checkpoint") from exc
          for row in rows:
              if not isinstance(row, dict) or not isinstance(row.get("generation_id"), str):
                  continue
              if not re.fullmatch(r"[a-f0-9]{64}", row["generation_id"]):
                  raise SystemExit("FAIL invalid generation id in upstream catalogue state index")
              if row["generation_id"] in shadowed:
                  continue
              cp_path = state / "sources/data_go_kr/generations" / f"{row['generation_id']}.json"
              if not cp_path.is_file():
                  continue
              checkpoint = json.loads(cp_path.read_text(encoding="utf-8"))
              claimed = checkpoint.get("checkpoint_sha256")
              unsigned = dict(checkpoint)
              unsigned.pop("checkpoint_sha256", None)
              canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              if hashlib.sha256(canonical).hexdigest() != claimed:
                  raise SystemExit("FAIL corrupt upstream catalogue checkpoint digest")
              if checkpoint.get("generation_id") != row["generation_id"]:
                  raise SystemExit("FAIL upstream catalogue generation identity mismatch")
              status = checkpoint.get("status")
              outcome = checkpoint.get("outcome") if isinstance(checkpoint.get("outcome"), dict) else {}
              active = status in {"queued", "retry", "enriching", "composing"} or (
                  status == "ready" and int(outcome.get("detail_retry_count", 0) or 0) > 0
              )
              if not active or not checkpoint.get("generation_inputs", {}).get("candidate_sha256"):
                  continue
              input_refs = checkpoint.get("input_artifacts")
              if not isinstance(input_refs, list):
                  continue
              candidate_sha = checkpoint["generation_inputs"]["candidate_sha256"]
              refs = [item for item in input_refs if isinstance(item, dict) and item.get("candidate_sha256") == candidate_sha]
              if not refs:
                  continue
              ref = refs[-1]
              observation = checkpoint.get("last_observation") if isinstance(checkpoint.get("last_observation"), dict) else {}
              candidates.append((str(checkpoint.get("last_progress_at") or checkpoint.get("last_heartbeat_at") or ""), checkpoint, ref, observation))
          if not candidates:
              action = os.environ.get("SOURCE_RECOVERY_ACTION", "")
              if action in {"rebuild", "resume"}:
                  producer_id = os.environ.get("SOURCE_RECOVERY_PRODUCER_RUN_ID", "")
                  generation_id = os.environ.get("SOURCE_RECOVERY_GENERATION_ID", "")
                  artifact_id = os.environ.get("SOURCE_RECOVERY_ARTIFACT_ID", "")
                  artifact_name = os.environ.get("SOURCE_RECOVERY_ARTIFACT_NAME", "")
                  if not producer_id.isdigit() or not re.fullmatch(r"[a-f0-9]{64}", generation_id):
                      raise SystemExit("FAIL source recovery locator identity is invalid")
                  print("decision=process")
                  print(f"producer_run_id={producer_id}")
                  print(f"generation_id={generation_id}")
                  print(f"expected_input_artifact_id={artifact_id}")
                  print("expected_input_expires_at=")
                  print(f"expected_input_name={artifact_name}")
                  request_path = os.environ.get("SOURCE_RECOVERY_REQUEST_PATH", "") if action == "rebuild" else ""
                  print(f"source_work_request={request_path}")
              else:
                  print("decision=idle")
                  print(f"idle_reason={os.environ.get('SOURCE_RECOVERY_REASON') or 'no_active_generation'}")
                  print(f"source_work_request={os.environ.get('SOURCE_RECOVERY_REQUEST_PATH', '')}")
              raise SystemExit(0)
          _, checkpoint, ref, observation = sorted(candidates, key=lambda item: item[0])[0]
          producer_id = str(ref.get("run_id") or observation.get("producer_run_id") or "")
          name = str(ref.get("name") or "")
          artifact_id = str(ref.get("artifact_id") or "")
          expires = str(ref.get("expires_at") or "")
          if (
              not producer_id.isdigit()
              or name != f"upstream-catalog-refresh-{producer_id}"
              or not artifact_id.isdigit()
              or not re.fullmatch(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)", expires)
          ):
              raise SystemExit("FAIL active generation has invalid input artifact locator")
          print("decision=process")
          print(f"producer_run_id={producer_id}")
          print(f"generation_id={checkpoint['generation_id']}")
          print(f"expected_input_artifact_id={artifact_id}")
          print(f"expected_input_expires_at={expires}")
          print(f"expected_input_name={name}")
          print("source_work_request=")
          PY

      - name: Resolve producer workflow revision
        if: steps.select.outputs.decision == 'process'
        id: producer
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ steps.select.outputs.producer_head_sha }}
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "${PRODUCER_RUN_ID}" =~ ^[0-9]+$ ]]
          gh api "repos/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" > producer-run.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          value = json.loads(Path("producer-run.json").read_text(encoding="utf-8"))
          expected = {
              "name": "Upstream catalog refresh",
              "path": ".github/workflows/upstream-catalog-refresh.yml",
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["DEFAULT_BRANCH"],
          }
          if value.get("name") != expected["name"] or value.get("path") != expected["path"]:
              raise SystemExit("FAIL producer workflow identity is not the trusted weekly collector")
          if (value.get("head_repository") or {}).get("full_name") != expected["repository"]:
              raise SystemExit("FAIL producer head repository is not this repository")
          if value.get("head_branch") != expected["branch"] or value.get("conclusion") != "success":
              raise SystemExit("FAIL producer run is not a successful default-branch observation")
          if value.get("event") not in {"schedule", "workflow_dispatch"}:
              raise SystemExit("FAIL producer run event is outside the trusted weekly observation paths")
          source_sha = str(value.get("head_sha", ""))
          if not re.fullmatch(r"[a-f0-9]{40}", source_sha):
              raise SystemExit("FAIL producer commit identity is invalid")
          if os.environ.get("EVENT_HEAD_SHA") and source_sha != os.environ["EVENT_HEAD_SHA"]:
              raise SystemExit("FAIL selected producer SHA does not match its exact Actions API record")
          if str(value.get("id")) != os.environ["PRODUCER_RUN_ID"]:
              raise SystemExit("FAIL producer run id does not match the selected run")
          producer_url = value.get("html_url", "")
          expected_url = f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['PRODUCER_RUN_ID']}"
          if producer_url != expected_url:
              raise SystemExit("FAIL producer run URL is invalid")
          PY
          IFS=$'\t' read -r source_sha producer_url < <(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("producer-run.json").read_text(encoding="utf-8"))
          print("\t".join((value["head_sha"], value["html_url"])))
          PY
          )
          git fetch --no-tags --depth=1 origin "${source_sha}"
          git worktree add --detach ../datapan-registry "${source_sha}"
          echo "head_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "run_url=${producer_url}" >> "${GITHUB_OUTPUT}"

      - name: Bind the collector upload to the exact completed run attempt
        if: steps.select.outputs.decision == 'process'
        id: producer_attempt
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.head_sha }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.select.outputs.expected_producer_attempt || github.event.workflow_run.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ steps.select.outputs.expected_input_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.select.outputs.expected_input_digest }}
          EXPECTED_ARTIFACT_SIZE: ${{ steps.select.outputs.expected_input_size }}
          DISCOVERY_API_REQUESTS: ${{ steps.handoff.outputs.api_requests }}
        run: |
          set -euo pipefail
          args=(
            --repository "${REPOSITORY}" --default-branch "${DEFAULT_BRANCH}"
            --state-dir "${STATE_DIR}" --inspect-run-id "${PRODUCER_RUN_ID}"
            --expected-head-sha "${PRODUCER_HEAD_SHA}"
          )
          if [ -n "${EXPECTED_RUN_ATTEMPT}" ]; then args+=(--expected-run-attempt "${EXPECTED_RUN_ATTEMPT}"); fi
          if [ -n "${EXPECTED_ARTIFACT_ID}" ]; then args+=(--expected-artifact-id "${EXPECTED_ARTIFACT_ID}"); fi
          if [ -n "${EXPECTED_ARTIFACT_DIGEST}" ]; then args+=(--expected-artifact-digest "${EXPECTED_ARTIFACT_DIGEST}"); fi
          if [ -n "${EXPECTED_ARTIFACT_SIZE}" ]; then args+=(--expected-artifact-size "${EXPECTED_ARTIFACT_SIZE}"); fi
          discovery_requests="${DISCOVERY_API_REQUESTS:-0}"
          [[ "${discovery_requests}" =~ ^[0-9]+$ ]]
          prior_requests=$((discovery_requests + 1)) # producer revision lookup above
          args+=(--prior-api-requests "${prior_requests}" --reserve-api-requests 3)
          python3 scripts/upstream_catalogue_handoff.py "${args[@]}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        if: steps.select.outputs.decision == 'process' || steps.select.outputs.decision == 'recover'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install recovery validation dependency
        if: steps.select.outputs.decision == 'recover'
        working-directory: bootstrap
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'

      - name: Materialize canonical registry and install validators
        if: steps.select.outputs.decision == 'process'
        working-directory: datapan-registry
        run: |
          set -euo pipefail
          python3 ../bootstrap/scripts/materialize-canonical-registry.py
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'PyYAML==6.0.2'
          python3 ../bootstrap/scripts/validate-source-refresh-policy.py \
            --schema ../bootstrap/schemas/datapan.source-refresh-policy.v1.schema.json

      - name: Download and bind exact producer artifact
        if: steps.select.outputs.decision == 'process'
        id: input_artifact
        working-directory: datapan-registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          PRODUCER_HEAD_SHA: ${{ steps.producer_attempt.outputs.head_sha }}
          PRODUCER_ATTEMPT: ${{ steps.producer_attempt.outputs.run_attempt }}
          PRODUCER_RUN_STARTED_AT: ${{ steps.producer_attempt.outputs.run_started_at }}
          PRODUCER_RUN_COMPLETED_AT: ${{ steps.producer_attempt.outputs.run_completed_at }}
          PRODUCER_RUN_UPDATED_AT: ${{ steps.producer_attempt.outputs.run_updated_at }}
          OBSERVE_JOB_STARTED_AT: ${{ steps.producer_attempt.outputs.observe_job_started_at }}
          OBSERVE_JOB_COMPLETED_AT: ${{ steps.producer_attempt.outputs.observe_job_completed_at }}
          ARTIFACT_ID: ${{ steps.producer_attempt.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.producer_attempt.outputs.artifact_name }}
          ARTIFACT_EXPIRES_AT: ${{ steps.producer_attempt.outputs.artifact_expires_at }}
          ARTIFACT_CREATED_AT: ${{ steps.producer_attempt.outputs.artifact_created_at }}
          ARTIFACT_DIGEST: ${{ steps.producer_attempt.outputs.artifact_digest_sha256 }}
          ARTIFACT_SIZE: ${{ steps.producer_attempt.outputs.artifact_size_bytes }}
          REPOSITORY_ID: ${{ steps.producer_attempt.outputs.repository_id }}
          HEAD_REPOSITORY_ID: ${{ steps.producer_attempt.outputs.head_repository_id }}
          PRODUCER_EVENT: ${{ steps.producer_attempt.outputs.event }}
          PRODUCER_URL: ${{ steps.producer_attempt.outputs.producer_url }}
        run: |
          set -euo pipefail
          [[ "${PRODUCER_RUN_ID}" =~ ^[0-9]+$ && "${PRODUCER_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ && "${ARTIFACT_SIZE}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p .datapan/ci/upstream-refresh
          root=.datapan/ci/upstream-refresh
          archive="${root}/collector-artifact.zip"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "${root}/artifact-metadata.json"
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          artifact = json.loads(Path(".datapan/ci/upstream-refresh/artifact-metadata.json").read_text(encoding="utf-8"))
          env = os.environ
          workflow_run = artifact.get("workflow_run")
          try:
              expires = dt.datetime.fromisoformat(str(artifact.get("expires_at", "")).replace("Z", "+00:00"))
              size = int(artifact.get("size_in_bytes", 0))
          except (TypeError, ValueError) as exc:
              raise SystemExit("FAIL exact collector artifact metadata is malformed") from exc
          if (
              str(artifact.get("id")) != env["ARTIFACT_ID"]
              or artifact.get("name") != env["ARTIFACT_NAME"]
              or artifact.get("expired") is not False
              or artifact.get("expires_at") != env["ARTIFACT_EXPIRES_AT"]
              or artifact.get("created_at") != env["ARTIFACT_CREATED_AT"]
              or artifact.get("digest") != "sha256:" + env["ARTIFACT_DIGEST"]
              or size != int(env["ARTIFACT_SIZE"]) or not 0 < size <= 268435456
              or expires.tzinfo is None or expires <= dt.datetime.now(dt.timezone.utc)
              or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id")) != env["PRODUCER_RUN_ID"]
              or workflow_run.get("head_sha") != env["PRODUCER_HEAD_SHA"]
              or str(workflow_run.get("repository_id")) != env["REPOSITORY_ID"]
              or str(workflow_run.get("head_repository_id")) != env["HEAD_REPOSITORY_ID"]
          ):
              raise SystemExit("FAIL exact collector artifact metadata changed before download")
          job_started = dt.datetime.fromisoformat(env["OBSERVE_JOB_STARTED_AT"].replace("Z", "+00:00"))
          job_completed = dt.datetime.fromisoformat(env["OBSERVE_JOB_COMPLETED_AT"].replace("Z", "+00:00"))
          created = dt.datetime.fromisoformat(str(artifact["created_at"]).replace("Z", "+00:00"))
          if not job_started <= created <= job_completed:
              raise SystemExit("FAIL collector artifact is outside the exact observe job interval")
          PY
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${archive}"
          gh api "repos/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" > "${root}/producer-run-after-download.json"
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path

          root = Path(".datapan/ci/upstream-refresh")
          artifact = json.loads((root / "artifact-metadata.json").read_text(encoding="utf-8"))
          run = json.loads((root / "producer-run-after-download.json").read_text(encoding="utf-8"))
          env = os.environ
          expected = {
              "id": env["ARTIFACT_ID"], "name": env["ARTIFACT_NAME"],
              "expires_at": env["ARTIFACT_EXPIRES_AT"], "digest": "sha256:" + env["ARTIFACT_DIGEST"],
              "size_in_bytes": int(env["ARTIFACT_SIZE"]), "expired": False,
              "created_at": env["ARTIFACT_CREATED_AT"],
          }
          if any(str(artifact.get(key)) != str(value) for key, value in expected.items()):
              raise SystemExit("FAIL exact collector artifact API metadata changed")
          workflow_run = artifact.get("workflow_run")
          if not isinstance(workflow_run, dict) or (
              str(workflow_run.get("id")) != env["PRODUCER_RUN_ID"]
              or workflow_run.get("head_sha") != env["PRODUCER_HEAD_SHA"]
              or str(workflow_run.get("repository_id")) != env["REPOSITORY_ID"]
              or str(workflow_run.get("head_repository_id")) != env["HEAD_REPOSITORY_ID"]
          ):
              raise SystemExit("FAIL exact collector artifact workflow binding changed")
          if (
              str(run.get("id")) != env["PRODUCER_RUN_ID"]
              or run.get("name") != "Upstream catalog refresh"
              or run.get("path") != ".github/workflows/upstream-catalog-refresh.yml"
              or (run.get("repository") or {}).get("full_name") != env["REPOSITORY"]
              or (run.get("head_repository") or {}).get("full_name") != env["REPOSITORY"]
              or run.get("head_branch") != env["DEFAULT_BRANCH"]
              or run.get("head_sha") != env["PRODUCER_HEAD_SHA"]
              or run.get("event") != env["PRODUCER_EVENT"]
              or run.get("html_url") != env["PRODUCER_URL"]
              or int(run.get("run_attempt", -1)) != int(env["PRODUCER_ATTEMPT"])
              or run.get("status") != "completed" or run.get("conclusion") != "success"
              or run.get("run_started_at") != env["PRODUCER_RUN_STARTED_AT"]
              or run.get("updated_at") != env["PRODUCER_RUN_UPDATED_AT"]
          ):
              raise SystemExit("FAIL producer run attempt changed after exact archive download")
          expires = dt.datetime.fromisoformat(env["ARTIFACT_EXPIRES_AT"].replace("Z", "+00:00"))
          if expires.tzinfo is None or expires <= dt.datetime.now(dt.timezone.utc):
              raise SystemExit("FAIL exact collector artifact expired before download validation")
          archive = root / "collector-artifact.zip"
          archive_bytes = archive.read_bytes()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          if len(archive_bytes) != int(env["ARTIFACT_SIZE"]) or archive_sha != env["ARTIFACT_DIGEST"]:
              raise SystemExit("FAIL exact collector archive digest or size mismatch")
          allowed = {
              "candidate.registry.json", "catalog-diff.json",
              "upstream-refresh-evidence.json", "upstream-refresh-work-packet.json",
          }
          seen = set()
          total = 0
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  name = member.filename
                  if member.is_dir():
                      continue
                  if name not in allowed or name in seen or stat.S_IFMT(member.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit("FAIL collector artifact archive has unsafe or unexpected members")
                  seen.add(name)
                  total += member.file_size
                  if total > 268435456:
                      raise SystemExit("FAIL collector artifact expands beyond the input bound")
                  (root / name).write_bytes(bundle.read(member))
          required = allowed
          if seen != required:
              raise SystemExit("FAIL successful collector artifact is incomplete")
          evidence_path = root / "upstream-refresh-evidence.json"
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          candidate = root / "candidate.registry.json"
          diff = root / "catalog-diff.json"
          if evidence.get("source_id") != "data_go_kr" or evidence.get("collection", {}).get("succeeded") is not True:
              raise SystemExit("FAIL collector artifact is not a successful data_go_kr observation")
          observed_at = evidence.get("observed_at")
          parsed_observed = dt.datetime.fromisoformat(str(observed_at).replace("Z", "+00:00"))
          if parsed_observed.tzinfo is None or parsed_observed > dt.datetime.now(dt.timezone.utc) + dt.timedelta(minutes=5):
              raise SystemExit("FAIL collector evidence observation time is invalid")
          if (
              hashlib.sha256(candidate.read_bytes()).hexdigest() != evidence.get("snapshot", {}).get("sha256")
              or hashlib.sha256(diff.read_bytes()).hexdigest() != evidence.get("diff", {}).get("sha256")
          ):
              raise SystemExit("FAIL producer candidate or diff digest mismatch")
          envelope = {
              "schema_version": "datapan.upstream-catalogue-admission-envelope.v1",
              "repository": env["REPOSITORY"], "producer_run_id": env["PRODUCER_RUN_ID"],
              "run_attempt": int(env["PRODUCER_ATTEMPT"]), "head_sha": env["PRODUCER_HEAD_SHA"],
              "run_started_at": env["PRODUCER_RUN_STARTED_AT"], "run_completed_at": env["PRODUCER_RUN_COMPLETED_AT"],
              "observe_job_started_at": env["OBSERVE_JOB_STARTED_AT"], "observe_job_completed_at": env["OBSERVE_JOB_COMPLETED_AT"],
              "artifact_id": env["ARTIFACT_ID"], "artifact_name": env["ARTIFACT_NAME"],
              "artifact_expires_at": env["ARTIFACT_EXPIRES_AT"], "artifact_created_at": env["ARTIFACT_CREATED_AT"],
              "artifact_digest_sha256": env["ARTIFACT_DIGEST"], "artifact_size_bytes": int(env["ARTIFACT_SIZE"]),
              "archive_sha256": archive_sha, "archive_size_bytes": len(archive_bytes),
              "observed_at": observed_at,
              "refresh_evidence_sha256": hashlib.sha256(evidence_path.read_bytes()).hexdigest(),
              "event": env["PRODUCER_EVENT"],
          }
          (root / "collector-admission.json").write_text(json.dumps(envelope, sort_keys=True) + "\n", encoding="utf-8")
          print("found=true")
          print("input_error=")
          print(f"artifact_id={env['ARTIFACT_ID']}")
          print(f"expires_at={env['ARTIFACT_EXPIRES_AT']}")
          print("expired=false")
          print("archive_path=.datapan/ci/upstream-refresh/collector-artifact.zip")
          print("admission_file=.datapan/ci/upstream-refresh/collector-admission.json")
          PY

      - name: Calculate processor artifact expiry
        id: expiry
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import datetime as dt
          print("at=" + (dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=30)).replace(microsecond=0).isoformat().replace("+00:00", "Z"))
          PY

      - name: Authenticate and download the exact failed processor artifact
        if: steps.select.outputs.decision == 'recover'
        id: failed_artifact
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAILED_RUN_ID: ${{ steps.select.outputs.recover_failed_run_id }}
          FAILED_ATTEMPT: ${{ steps.select.outputs.recover_failed_attempt }}
        run: |
          set -euo pipefail
          root=.datapan/ci/failed-processor-recovery
          mkdir -p "${root}/artifact"
          gh api "repos/${REPOSITORY}/actions/runs/${FAILED_RUN_ID}" > "${root}/run-api.json"
          gh api "repos/${REPOSITORY}/actions/runs/${FAILED_RUN_ID}/artifacts?per_page=100" > "${root}/artifacts-api.json"
          python3 - "${root}" <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          repository = os.environ["REPOSITORY"]
          run_id = os.environ["FAILED_RUN_ID"]
          attempt = int(os.environ["FAILED_ATTEMPT"])
          default_branch = os.environ["DEFAULT_BRANCH"]
          run = json.loads((root / "run-api.json").read_text(encoding="utf-8"))
          if (
              str(run.get("id")) != run_id
              or run.get("name") != "Process upstream catalogue"
              or run.get("path") != ".github/workflows/upstream-catalogue-process.yml"
              or (run.get("head_repository") or {}).get("full_name") != repository
              or run.get("head_branch") != default_branch
              or run.get("status") != "completed"
              or run.get("conclusion") != "failure"
              or run.get("event") not in {"workflow_dispatch", "schedule", "workflow_run"}
              or int(run.get("run_attempt", -1)) != attempt
              or not re.fullmatch(r"[a-f0-9]{40}", str(run.get("head_sha") or ""))
          ):
              raise SystemExit("FAIL failed processor run is not the exact trusted default-branch failure")
          artifacts_payload = json.loads((root / "artifacts-api.json").read_text(encoding="utf-8"))
          name = f"upstream-catalogue-processing-{run_id}-{attempt}"
          matches = [item for item in artifacts_payload.get("artifacts", []) if item.get("name") == name]
          if len(matches) != 1:
              raise SystemExit("FAIL failed processor run does not have exactly one matching artifact")
          artifact = matches[0]
          artifact_id = str(artifact.get("id") or "")
          expires_at = str(artifact.get("expires_at") or "")
          expiry = dt.datetime.fromisoformat(expires_at.replace("Z", "+00:00")) if expires_at else None
          digest = str(artifact.get("digest") or "")
          if (
              not artifact_id.isdigit()
              or artifact.get("expired") is not False
              or expiry is None or expiry.tzinfo is None or expiry <= dt.datetime.now(dt.timezone.utc)
              or not re.fullmatch(r"sha256:[a-f0-9]{64}", digest)
              or not 0 < int(artifact.get("size_in_bytes", 0)) <= 536936448
          ):
              raise SystemExit("FAIL failed processor artifact is expired or has incomplete metadata")
          workflow_run = artifact.get("workflow_run") if isinstance(artifact.get("workflow_run"), dict) else {}
          if (
              str(workflow_run.get("id")) != run_id
              or workflow_run.get("head_sha") != run.get("head_sha")
              or workflow_run.get("head_branch") != default_branch
          ):
              raise SystemExit("FAIL failed processor artifact is not attached to the selected run")
          failed_run = {
              "repository": repository, "id": int(run_id), "name": run["name"], "path": run["path"],
              "head_branch": run["head_branch"], "head_sha": run["head_sha"], "event": run["event"],
              "status": run["status"], "conclusion": run["conclusion"], "run_attempt": attempt,
              "default_branch": default_branch,
          }
          failed_artifact = {
              "repository": repository, "run_id": run_id, "run_attempt": attempt,
              "id": int(artifact_id), "name": name, "expired": artifact["expired"],
              "expires_at": expires_at, "created_at": artifact.get("created_at"),
              "size_in_bytes": int(artifact["size_in_bytes"]), "digest": digest,
              "workflow_run": workflow_run,
          }
          (root / "failed-run-metadata.json").write_text(json.dumps(failed_run, sort_keys=True) + "\n", encoding="utf-8")
          (root / "failed-artifact-metadata.json").write_text(json.dumps(failed_artifact, sort_keys=True) + "\n", encoding="utf-8")
          (root / "artifact-id.txt").write_text(artifact_id + "\n", encoding="utf-8")
          PY
          artifact_id="$(cat "${root}/artifact-id.txt")"
          gh api -H 'Accept: application/vnd.github+json' "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${root}/artifact.zip"
          python3 - "${root}" <<'PY'
          import hashlib
          import json
          import stat
          import zipfile
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          metadata = json.loads((root / "failed-artifact-metadata.json").read_text(encoding="utf-8"))
          archive = root / "artifact.zip"
          expected_digest = metadata["digest"].removeprefix("sha256:")
          if (
              archive.stat().st_size != metadata["size_in_bytes"]
              or hashlib.sha256(archive.read_bytes()).hexdigest() != expected_digest
          ):
              raise SystemExit("FAIL downloaded failed processor artifact digest mismatch")
          destination = root / "artifact"
          total = 0
          seen = set()
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  name = member.filename
                  if member.is_dir():
                      continue
                  if name != Path(name).name or name in seen or stat.S_IFMT(member.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit("FAIL failed processor archive contains an unsafe member path")
                  seen.add(name)
                  total += member.file_size
                  if total > 536936448:
                      raise SystemExit("FAIL failed processor archive exceeds the recovery size bound")
                  (destination / name).write_bytes(bundle.read(member))
          required = {"upstream-catalogue-checkpoint-receipt.json", "upstream-catalogue-processing-result.json"}
          if not required <= seen:
              raise SystemExit("FAIL failed processor archive lacks its exact checkpoint/result receipts")
          PY
          echo "artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=upstream-catalogue-processing-${FAILED_RUN_ID}-${FAILED_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Restore digest-bound detail cache when available
        if: steps.select.outputs.decision == 'process' && steps.input_artifact.outputs.input_error == ''
        id: cache
        working-directory: datapan-registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          TARGET_GENERATION_ID: ${{ steps.select.outputs.generation_id }}
        run: |
          set -euo pipefail
          rm -rf .datapan/ci/detail-cache
          mkdir -p .datapan/ci/detail-cache
          python3 scripts/upstream_catalogue_cache_source.py restore \
            --state-dir "${STATE_DIR}" \
            --target-generation-id "${TARGET_GENERATION_ID}" \
            --repository "${REPOSITORY}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --output-dir .datapan/ci/detail-cache \
            --github-output "${GITHUB_OUTPUT}" \
            --deadline-seconds 120

      - name: Authenticate same-observation B and merged-C parents before reservation
        id: derivation
        if: >-
          steps.select.outputs.decision == 'process' &&
          steps.input_artifact.outputs.input_error == '' &&
          steps.select.outputs.generation_id != ''
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          TARGET_GENERATION_ID: ${{ steps.select.outputs.generation_id }}
          COLLECTOR_ADMISSION: ${{ steps.input_artifact.outputs.admission_file }}
          COLLECTOR_ARCHIVE: ${{ steps.input_artifact.outputs.archive_path }}
          PRODUCER_RUN_ID: ${{ steps.producer_attempt.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer_attempt.outputs.run_attempt }}
          PRODUCER_HEAD_SHA: ${{ steps.producer_attempt.outputs.head_sha }}
          PRODUCER_RUN_STARTED_AT: ${{ steps.producer_attempt.outputs.run_started_at }}
          PRODUCER_RUN_COMPLETED_AT: ${{ steps.producer_attempt.outputs.run_completed_at }}
          OBSERVE_JOB_STARTED_AT: ${{ steps.producer_attempt.outputs.observe_job_started_at }}
          OBSERVE_JOB_COMPLETED_AT: ${{ steps.producer_attempt.outputs.observe_job_completed_at }}
          ARTIFACT_ID: ${{ steps.producer_attempt.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.producer_attempt.outputs.artifact_name }}
          ARTIFACT_EXPIRES_AT: ${{ steps.producer_attempt.outputs.artifact_expires_at }}
          ARTIFACT_CREATED_AT: ${{ steps.producer_attempt.outputs.artifact_created_at }}
          ARTIFACT_DIGEST: ${{ steps.producer_attempt.outputs.artifact_digest_sha256 }}
          ARTIFACT_SIZE: ${{ steps.producer_attempt.outputs.artifact_size_bytes }}
          PRODUCER_EVENT: ${{ steps.producer_attempt.outputs.event }}
