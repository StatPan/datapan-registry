          DERIVATION_OUTPUT: .datapan/ci/same-observation-derivation
          CACHE_OWNER_ARCHIVE: ${{ steps.cache.outputs.owner_archive_path }}
          SOURCE_WORK_REQUEST: ${{ steps.select.outputs.source_work_request }}
        run: |
          set -euo pipefail
          archive_args=()
          if [ -n "${CACHE_OWNER_ARCHIVE}" ]; then
            archive_args+=(--resume-bundle-archive "../datapan-registry/${CACHE_OWNER_ARCHIVE}")
          fi
          source_request_args=()
          if [ -n "${SOURCE_WORK_REQUEST}" ]; then
            source_request_args+=(--source-work-request "${SOURCE_WORK_REQUEST}")
          fi
          python3 scripts/prepare-upstream-catalogue-derivation.py \
            --main-root . --source-root ../datapan-registry --state-dir "${STATE_DIR}" \
            --target-generation-id "${TARGET_GENERATION_ID}" \
            --repository "${REPOSITORY}" --default-branch "${DEFAULT_BRANCH}" \
            --collector-admission "../datapan-registry/${COLLECTOR_ADMISSION}" \
            --collector-archive "../datapan-registry/${COLLECTOR_ARCHIVE}" \
            --producer-run-url "${PRODUCER_RUN_URL}" \
            --producer-run-id "${PRODUCER_RUN_ID}" \
            --producer-run-attempt "${PRODUCER_RUN_ATTEMPT}" \
            --producer-head-sha "${PRODUCER_HEAD_SHA}" \
            --producer-run-started-at "${PRODUCER_RUN_STARTED_AT}" \
            --producer-run-completed-at "${PRODUCER_RUN_COMPLETED_AT}" \
            --producer-observe-job-started-at "${OBSERVE_JOB_STARTED_AT}" \
            --producer-observe-job-completed-at "${OBSERVE_JOB_COMPLETED_AT}" \
            --producer-artifact-id "${ARTIFACT_ID}" \
            --producer-artifact-name "${ARTIFACT_NAME}" \
            --producer-artifact-expires-at "${ARTIFACT_EXPIRES_AT}" \
            --producer-artifact-created-at "${ARTIFACT_CREATED_AT}" \
            --producer-artifact-digest-sha256 "${ARTIFACT_DIGEST}" \
            --producer-artifact-size-bytes "${ARTIFACT_SIZE}" \
            --producer-event "${PRODUCER_EVENT}" \
            --candidate ../datapan-registry/.datapan/ci/upstream-refresh/candidate.registry.json \
            --refresh-evidence ../datapan-registry/.datapan/ci/upstream-refresh/upstream-refresh-evidence.json \
            --diff ../datapan-registry/.datapan/ci/upstream-refresh/catalog-diff.json \
            --resume-bundle ../datapan-registry/.datapan/ci/detail-cache \
            "${archive_args[@]}" \
            "${source_request_args[@]}" \
            --output-dir "${DERIVATION_OUTPUT}" --github-output "${GITHUB_OUTPUT}"

      - name: Claim bounded request budget
        if: >-
          steps.select.outputs.decision == 'process' &&
          steps.derivation.outcome != 'failure'
        id: claim
        working-directory: datapan-registry
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          PRODUCER_RUN_URL: ${{ steps.producer.outputs.run_url }}
          PRODUCER_HEAD_SHA: ${{ steps.producer_attempt.outputs.head_sha }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer_attempt.outputs.run_attempt }}
          PRODUCER_RUN_STARTED_AT: ${{ steps.producer_attempt.outputs.run_started_at }}
          PRODUCER_RUN_COMPLETED_AT: ${{ steps.producer_attempt.outputs.run_completed_at }}
          OBSERVE_JOB_STARTED_AT: ${{ steps.producer_attempt.outputs.observe_job_started_at }}
          OBSERVE_JOB_COMPLETED_AT: ${{ steps.producer_attempt.outputs.observe_job_completed_at }}
          ARTIFACT_ID: ${{ steps.producer_attempt.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.producer_attempt.outputs.artifact_name }}
          ARTIFACT_EXPIRES_AT: ${{ steps.producer_attempt.outputs.artifact_expires_at }}
          ARTIFACT_CREATED_AT: ${{ steps.producer_attempt.outputs.artifact_created_at }}
          ARTIFACT_DIGEST: ${{ steps.producer_attempt.outputs.artifact_digest_sha256 }}
          ARTIFACT_SIZE: ${{ steps.producer_attempt.outputs.artifact_size_bytes }}
          PRODUCER_EVENT: ${{ steps.producer_attempt.outputs.event }}
          INPUT_ERROR: ${{ steps.input_artifact.outputs.input_error }}
          INPUT_ARTIFACT_NAME: ${{ steps.select.outputs.expected_input_name }}
          INPUT_ARTIFACT_ID: ${{ steps.input_artifact.outputs.artifact_id }}
          INPUT_EXPIRES_AT: ${{ steps.input_artifact.outputs.expires_at }}
          INPUT_EXPIRED: ${{ steps.input_artifact.outputs.expired }}
          INPUT_ADMISSION_FILE: ${{ steps.input_artifact.outputs.admission_file }}
          INPUT_ARCHIVE_PATH: ${{ steps.input_artifact.outputs.archive_path }}
          TARGET_GENERATION_ID: ${{ steps.select.outputs.generation_id }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSOR_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PROCESSOR_ARTIFACT_EXPIRES_AT: ${{ steps.expiry.outputs.at }}
          REPOSITORY: ${{ github.repository }}
          RESUME_EVIDENCE: ${{ steps.cache.outputs.evidence_path }}
          RESUME_SOURCE_CONTEXT: ${{ steps.cache.outputs.source_context_path }}
          RESUME_OWNER_ARCHIVE: ${{ steps.cache.outputs.owner_archive_path }}
          DERIVATION_ENABLED: ${{ steps.derivation.outputs.derivation_enabled }}
          DERIVATION_GENERATION_ID: ${{ steps.derivation.outputs.generation_id }}
          DERIVATION_BASELINE: ${{ steps.derivation.outputs.composition_baseline_path }}
          DERIVATION_FILE: ${{ steps.derivation.outputs.derivation_path }}
          DERIVATION_JOURNAL: ${{ steps.derivation.outputs.journal_path }}
          DERIVATION_JOURNAL_REF_SHA: ${{ steps.derivation.outputs.journal_ref_sha }}
          RESUME_PARENT_BUNDLE: ${{ steps.derivation.outputs.resume_parent_bundle_dir }}
          RESUME_PARENT_ARCHIVE: ${{ steps.derivation.outputs.resume_parent_archive_path }}
          DERIVATION_RESUME_EVIDENCE: ${{ steps.derivation.outputs.resume_enrichment_evidence_path }}
          CANONICAL_PARENT_BUNDLE: ${{ steps.derivation.outputs.canonical_parent_bundle_dir }}
          CANONICAL_PARENT_ARCHIVE: ${{ steps.derivation.outputs.canonical_parent_archive_path }}
          SOURCE_EPOCH: ${{ steps.derivation.outputs.source_epoch_path }}
          SOURCE_TARGET_CONTRACT: ${{ steps.derivation.outputs.source_target_contract_path }}
          EXPECTED_STATE_HEAD_SHA: ${{ steps.state.outputs.old_sha }}
        run: |
          set -euo pipefail
          mkdir -p .datapan/ci/upstream-catalogue-processing
          rm -f \
            .datapan/ci/upstream-catalogue-processing/upstream-catalogue-checkpoint-receipt.json \
            .datapan/ci/upstream-catalogue-processing/upstream-catalogue-replay-persistence-receipt.json
          if [ "${DERIVATION_ENABLED:-false}" = "true" ]; then
            RESUME_EVIDENCE="${DERIVATION_RESUME_EVIDENCE}"
            RESUME_SOURCE_CONTEXT="${RESUME_PARENT_BUNDLE}/upstream-catalogue-cache-source-context.json"
            RESUME_OWNER_ARCHIVE="${RESUME_PARENT_ARCHIVE}"
          fi
          args=(
            --baseline data/data-go-kr.registry.json
            --source-policy policy/source-refresh.json
            --provider-index data/provider-index.json
            --checkpoint-schema ../bootstrap/schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json
            --composer ../bootstrap/scripts/compose-upstream-catalogue-candidate.py
            --state-dir "${STATE_DIR}"
            --output-dir .datapan/ci/upstream-catalogue-processing
            --producer-run-id "${PRODUCER_RUN_ID}"
            --producer-run-url "${PRODUCER_RUN_URL}"
            --processor-run-id "${PROCESSOR_RUN_ID}"
            --processor-artifact-run-id "${PROCESSOR_ARTIFACT_RUN_ID}"
            --repository "${REPOSITORY}"
            --execution-mode live
            --replay-state-head-sha "${EXPECTED_STATE_HEAD_SHA}"
            --artifact-name "${INPUT_ARTIFACT_NAME}"
            --artifact-expires-at "${INPUT_EXPIRES_AT}"
            --output-artifact-expires-at "${PROCESSOR_ARTIFACT_EXPIRES_AT}"
            --max-attempts 24 --max-queue 48 --retries-per-detail 2 --timeout 20
          )
          if [ -n "${INPUT_ARTIFACT_ID}" ]; then args+=(--input-artifact-id "${INPUT_ARTIFACT_ID}"); fi
          if [ -n "${PRODUCER_HEAD_SHA}" ]; then args+=(--producer-head-sha "${PRODUCER_HEAD_SHA}"); fi
          args+=(
            --producer-run-attempt "${PRODUCER_RUN_ATTEMPT}"
            --producer-run-started-at "${PRODUCER_RUN_STARTED_AT}"
            --producer-run-completed-at "${PRODUCER_RUN_COMPLETED_AT}"
            --producer-observe-job-started-at "${OBSERVE_JOB_STARTED_AT}"
            --producer-observe-job-completed-at "${OBSERVE_JOB_COMPLETED_AT}"
            --producer-artifact-created-at "${ARTIFACT_CREATED_AT}"
            --producer-artifact-digest-sha256 "${ARTIFACT_DIGEST}"
            --producer-artifact-size-bytes "${ARTIFACT_SIZE}"
            --producer-event "${PRODUCER_EVENT}"
          )
          if [ -n "${INPUT_ADMISSION_FILE}" ]; then args+=(--collector-admission-file "${INPUT_ADMISSION_FILE}"); fi
          if [ -n "${INPUT_ARCHIVE_PATH}" ]; then args+=(--collector-archive "${INPUT_ARCHIVE_PATH}"); fi
          if [ "${DERIVATION_ENABLED:-false}" = "true" ]; then
            if [ -z "${DERIVATION_GENERATION_ID}" ]; then echo "FAIL derivation plan omitted its exact generation identity" >&2; exit 2; fi
            args+=(
              --expected-generation-id "${DERIVATION_GENERATION_ID}"
              --composition-baseline "${DERIVATION_BASELINE}"
              --same-observation-derivation "${DERIVATION_FILE}"
              --current-main-root ../bootstrap
              --derivation-journal "${DERIVATION_JOURNAL}"
              --derivation-journal-ref-sha "${DERIVATION_JOURNAL_REF_SHA}"
              --resume-parent-bundle-dir "${RESUME_PARENT_BUNDLE}"
              --resume-parent-archive "${RESUME_PARENT_ARCHIVE}"
              --canonical-parent-bundle-dir "${CANONICAL_PARENT_BUNDLE}"
              --canonical-parent-archive "${CANONICAL_PARENT_ARCHIVE}"
              --canonical-update-pr-helper ../bootstrap/scripts/canonical_update_pr.py
              --canonical-update-journal-schema ../bootstrap/schemas/datapan.canonical-update-promotion-journal.v1.schema.json
            )
