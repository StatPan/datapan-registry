                exit 2
              fi
              if [ -z "${RESUME_OWNER_ARCHIVE}" ] || [ ! -f "${RESUME_OWNER_ARCHIVE}" ]; then
                echo "FAIL authenticated detail cache lacks its exact retained owner archive" >&2
                exit 2
              fi
              args+=(--resume-enrichment-evidence "${RESUME_EVIDENCE}" --resume-source-context "${RESUME_SOURCE_CONTEXT}" --resume-owner-archive "${RESUME_OWNER_ARCHIVE}")
            fi
          fi
          set +e
          python3 ../bootstrap/scripts/process-upstream-catalogue-candidate.py "${args[@]}"
          status="$?"
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          export PROCESS_EXIT_CODE="${status}"
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import importlib.util
          import json
          import os
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(".datapan/ci/upstream-catalogue-processing")
          result_path = root / "upstream-catalogue-processing-result.json"
          checkpoint_receipt_path = root / "upstream-catalogue-checkpoint-receipt.json"
          replay_receipt_path = root / "upstream-catalogue-replay-persistence-receipt.json"
          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              result = {}
          replay_candidate = bool(
              isinstance(result, dict)
              and result.get("status") == "idle"
              and result.get("reason") == "exact_producer_delivery_replay"
              and result.get("processing_replay") is True
              and result.get("candidate_available") is False
          )
          checkpoint_persisted = False
          replay_authenticated = False
          if replay_candidate:
              try:
                  processor_path = pathlib.Path(
                      "../bootstrap/scripts/process-upstream-catalogue-candidate.py",
                  ).resolve(strict=True)
                  sys.path.insert(0, str(processor_path.parent))
                  spec = importlib.util.spec_from_file_location("replay_processor", processor_path)
                  if spec is None or spec.loader is None:
                      raise ValueError("replay_validator_unavailable")
                  processor = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(processor)
                  receipt = json.loads(replay_receipt_path.read_text(encoding="utf-8"))
                  current_checkpoint = json.loads(checkpoint_receipt_path.read_text(encoding="utf-8"))
                  old_sha = os.environ.get("EXPECTED_STATE_HEAD_SHA", "")
                  state_repo = pathlib.Path("../state-repo")
                  verified_receipt = processor.verify_replay_persistence_receipt_from_committed_state(
                      receipt,
                      state_repository=state_repo,
                      prior_state_commit=old_sha,
                      expected_current_state_commit=old_sha,
                      phase=processor._REPLAY_VERIFY_PRE_CAS,
                      result=result,
                      checkpoint_receipt=current_checkpoint,
                  )
                  generation_id = verified_receipt["generation_id"]
                  source_id = verified_receipt["source_id"]
                  checkpoint_rel = f".datapan/upstream-catalogue-state/sources/{source_id}/generations/{generation_id}.json"
                  index_rel = f".datapan/upstream-catalogue-state/sources/{source_id}/index.json"
                  expected_changed_paths = set()
                  for change in verified_receipt["state_changes"]:
                      if change.startswith(f"sources/{source_id}/generations/{generation_id}.json#/"):
                          expected_changed_paths.add(checkpoint_rel)
                      elif change.startswith(f"sources/{source_id}/index.json#/"):
                          expected_changed_paths.add(index_rel)
                      else:
                          raise ValueError("replay_state_change_path_invalid")
                  status_output = subprocess.run(
                      ["git", "-C", str(state_repo), "status", "--porcelain=v1", "-z", "--untracked-files=all"],
                      check=True, capture_output=True,
                  ).stdout.decode("utf-8", errors="strict")
                  status_rows = [row for row in status_output.split("\0") if row]
                  if any(len(row) < 4 or row[:2] != " M" for row in status_rows):
                      raise ValueError("replay_state_worktree_status_invalid")
                  if {row[3:] for row in status_rows} != expected_changed_paths:
                      raise ValueError("replay_state_worktree_paths_mismatch")
                  replay_authenticated = True
                  checkpoint_persisted = True
              except Exception as exc:  # fail closed; bundle_check preserves the diagnostic result
                  print(f"FAIL replay persistence receipt: {type(exc).__name__}: {exc}", file=__import__("sys").stderr)
          elif os.environ.get("PROCESS_EXIT_CODE") != "1" and checkpoint_receipt_path.is_file():
              try:
                  checkpoint = json.loads(checkpoint_receipt_path.read_text(encoding="utf-8"))
                  checkpoint_persisted = bool(
                      checkpoint.get("schema_version") == "datapan.upstream-catalogue-checkpoint.v1"
                      and isinstance(checkpoint.get("generation_id"), str)
                      and __import__("re").fullmatch(r"[a-f0-9]{64}", str(checkpoint.get("checkpoint_sha256") or ""))
                  )
              except (OSError, json.JSONDecodeError, AttributeError):
                  checkpoint_persisted = False
          print(f"checkpoint_persisted={str(checkpoint_persisted).lower()}")
          print(f"replay_candidate={str(replay_candidate).lower()}")
          print(f"replay_authenticated={str(replay_authenticated).lower()}")
          PY
          if [ "${status}" = "1" ]; then
            echo "FAIL bounded claim made no committable checkpoint" >&2
            exit 1
          fi

      - name: Commit the request reservation with exact remote-SHA compare-and-swap
        if: >-
          steps.select.outputs.decision == 'process' &&
          steps.claim.outputs.checkpoint_persisted == 'true' &&
          steps.claim.outputs.exit_code != '1' &&
          (steps.claim.outputs.replay_candidate != 'true' || steps.claim.outputs.replay_authenticated == 'true')
        id: claim_push
        working-directory: bootstrap
        env:
          STATE_BRANCH: automation/upstream-catalogue-state
          OLD_SHA: ${{ steps.state.outputs.old_sha }}
        run: |
          set -euo pipefail
          python3 scripts/upstream-catalogue-state-branch.py commit-push \
            --worktree ../state-repo --remote origin --branch "${STATE_BRANCH}" \
            --repository "${GITHUB_REPOSITORY}" --expected-old-sha "${OLD_SHA}" \
            --message "Reserve upstream catalogue processing budget" \
            --result .datapan/ci/upstream-catalogue-claim-push.json
          jq -r '"claim_sha=" + .new_sha, "changed=" + (.changed | tostring)' .datapan/ci/upstream-catalogue-claim-push.json >> "${GITHUB_OUTPUT}"

      - name: Process the durably reserved detail batch
        if: steps.select.outputs.decision == 'process' && steps.claim_push.outputs.claim_sha != '' && steps.input_artifact.outputs.input_error == '' && steps.claim.outputs.replay_candidate != 'true'
        id: run_processor
        working-directory: datapan-registry
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          PRODUCER_RUN_URL: ${{ steps.producer.outputs.run_url }}
          PRODUCER_HEAD_SHA: ${{ steps.producer_attempt.outputs.head_sha }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer_attempt.outputs.run_attempt }}
          PRODUCER_RUN_STARTED_AT: ${{ steps.producer_attempt.outputs.run_started_at }}
          PRODUCER_RUN_COMPLETED_AT: ${{ steps.producer_attempt.outputs.run_completed_at }}
          OBSERVE_JOB_STARTED_AT: ${{ steps.producer_attempt.outputs.observe_job_started_at }}
          OBSERVE_JOB_COMPLETED_AT: ${{ steps.producer_attempt.outputs.observe_job_completed_at }}
          ARTIFACT_ID: ${{ steps.producer_attempt.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.producer_attempt.outputs.artifact_name }}
          ARTIFACT_EXPIRES_AT: ${{ steps.producer_attempt.outputs.artifact_expires_at }}
          ARTIFACT_CREATED_AT: ${{ steps.producer_attempt.outputs.artifact_created_at }}
          ARTIFACT_DIGEST: ${{ steps.producer_attempt.outputs.artifact_digest_sha256 }}
          ARTIFACT_SIZE: ${{ steps.producer_attempt.outputs.artifact_size_bytes }}
          PRODUCER_EVENT: ${{ steps.producer_attempt.outputs.event }}
          INPUT_ERROR: ${{ steps.input_artifact.outputs.input_error }}
          INPUT_ARTIFACT_NAME: ${{ steps.select.outputs.expected_input_name }}
          INPUT_ARTIFACT_ID: ${{ steps.input_artifact.outputs.artifact_id }}
          INPUT_EXPIRES_AT: ${{ steps.input_artifact.outputs.expires_at }}
          INPUT_EXPIRED: ${{ steps.input_artifact.outputs.expired }}
          INPUT_ADMISSION_FILE: ${{ steps.input_artifact.outputs.admission_file }}
          INPUT_ARCHIVE_PATH: ${{ steps.input_artifact.outputs.archive_path }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSOR_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PROCESSOR_ARTIFACT_EXPIRES_AT: ${{ steps.expiry.outputs.at }}
          REPOSITORY: ${{ github.repository }}
          RESUME_EVIDENCE: ${{ steps.cache.outputs.evidence_path }}
          RESUME_SOURCE_CONTEXT: ${{ steps.cache.outputs.source_context_path }}
          RESUME_OWNER_ARCHIVE: ${{ steps.cache.outputs.owner_archive_path }}
          DERIVATION_ENABLED: ${{ steps.derivation.outputs.derivation_enabled }}
          DERIVATION_GENERATION_ID: ${{ steps.derivation.outputs.generation_id }}
          DERIVATION_BASELINE: ${{ steps.derivation.outputs.composition_baseline_path }}
          DERIVATION_FILE: ${{ steps.derivation.outputs.derivation_path }}
          DERIVATION_JOURNAL: ${{ steps.derivation.outputs.journal_path }}
          DERIVATION_JOURNAL_REF_SHA: ${{ steps.derivation.outputs.journal_ref_sha }}
          RESUME_PARENT_BUNDLE: ${{ steps.derivation.outputs.resume_parent_bundle_dir }}
          RESUME_PARENT_ARCHIVE: ${{ steps.derivation.outputs.resume_parent_archive_path }}
          DERIVATION_RESUME_EVIDENCE: ${{ steps.derivation.outputs.resume_enrichment_evidence_path }}
          CANONICAL_PARENT_BUNDLE: ${{ steps.derivation.outputs.canonical_parent_bundle_dir }}
          CANONICAL_PARENT_ARCHIVE: ${{ steps.derivation.outputs.canonical_parent_archive_path }}
          SOURCE_EPOCH: ${{ steps.derivation.outputs.source_epoch_path }}
          SOURCE_TARGET_CONTRACT: ${{ steps.derivation.outputs.source_target_contract_path }}
        run: |
          set -euo pipefail
          output=.datapan/ci/upstream-catalogue-processing
          if [ "${DERIVATION_ENABLED:-false}" = "true" ]; then
            RESUME_EVIDENCE="${DERIVATION_RESUME_EVIDENCE}"
            RESUME_SOURCE_CONTEXT="${RESUME_PARENT_BUNDLE}/upstream-catalogue-cache-source-context.json"
            RESUME_OWNER_ARCHIVE="${RESUME_PARENT_ARCHIVE}"
          fi
          mkdir -p "${output}"
          result="${output}/upstream-catalogue-processing-result.json"
          generation_id="$(python3 - "${result}" <<'PY'
          import json
          import pathlib
          import re
          import sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          generation_id = str(value.get("generation_id") or "")
          if generation_id and not re.fullmatch(r"[a-f0-9]{64}", generation_id):
              raise SystemExit("FAIL processor returned an invalid generation id")
          print(generation_id)
          PY
          )"
          reserved=false
          checkpoint="${STATE_DIR}/sources/data_go_kr/generations/${generation_id}.json"
          if [ -n "${generation_id}" ] && [ -f "${checkpoint}" ]; then
            reserved="$(python3 - "${checkpoint}" "${PROCESSOR_RUN_ID}" <<'PY'
          import json
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          reservation = value.get("request_reservation") or {}
          print(str(reservation.get("owner_run_id") == sys.argv[2] and reservation.get("generation_id") == value.get("generation_id")).lower())
          PY
          )"
          fi
          if [ "${reserved}" = "true" ] && [ -z "${INPUT_ERROR}" ] && [ -n "${generation_id}" ]; then
            args=(
              --baseline data/data-go-kr.registry.json
              --candidate .datapan/ci/upstream-refresh/candidate.registry.json
              --diff .datapan/ci/upstream-refresh/catalog-diff.json
              --refresh-evidence .datapan/ci/upstream-refresh/upstream-refresh-evidence.json
              --source-policy policy/source-refresh.json
              --provider-index data/provider-index.json
              --checkpoint-schema ../bootstrap/schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json
              --composer ../bootstrap/scripts/compose-upstream-catalogue-candidate.py
              --state-dir "${STATE_DIR}"
              --output-dir "${output}"
              --producer-run-id "${PRODUCER_RUN_ID}"
              --producer-run-url "${PRODUCER_RUN_URL}"
              --processor-run-id "${PROCESSOR_RUN_ID}"
              --processor-artifact-run-id "${PROCESSOR_ARTIFACT_RUN_ID}"
              --repository "${REPOSITORY}"
              --execution-mode live
              --artifact-name "${INPUT_ARTIFACT_NAME}"
              --artifact-expires-at "${INPUT_EXPIRES_AT}"
              --output-artifact-expires-at "${PROCESSOR_ARTIFACT_EXPIRES_AT}"
              --max-attempts 24 --max-queue 48 --retries-per-detail 2 --timeout 20
              --require-durable-reservation
            )
          if [ -n "${INPUT_ARTIFACT_ID}" ]; then args+=(--input-artifact-id "${INPUT_ARTIFACT_ID}"); fi
          if [ -n "${PRODUCER_HEAD_SHA}" ]; then args+=(--producer-head-sha "${PRODUCER_HEAD_SHA}"); fi
          args+=(
            --producer-run-attempt "${PRODUCER_RUN_ATTEMPT}"
            --producer-run-started-at "${PRODUCER_RUN_STARTED_AT}"
            --producer-run-completed-at "${PRODUCER_RUN_COMPLETED_AT}"
            --producer-observe-job-started-at "${OBSERVE_JOB_STARTED_AT}"
            --producer-observe-job-completed-at "${OBSERVE_JOB_COMPLETED_AT}"
            --producer-artifact-created-at "${ARTIFACT_CREATED_AT}"
            --producer-artifact-digest-sha256 "${ARTIFACT_DIGEST}"
            --producer-artifact-size-bytes "${ARTIFACT_SIZE}"
            --producer-event "${PRODUCER_EVENT}"
          )
          if [ -n "${INPUT_ADMISSION_FILE}" ]; then args+=(--collector-admission-file "${INPUT_ADMISSION_FILE}"); fi
          if [ -n "${INPUT_ARCHIVE_PATH}" ]; then args+=(--collector-archive "${INPUT_ARCHIVE_PATH}"); fi
            if [ "${DERIVATION_ENABLED:-false}" = "true" ]; then
              if [ -z "${DERIVATION_GENERATION_ID}" ]; then echo "FAIL derivation plan omitted its exact generation identity" >&2; exit 2; fi
              args+=(
                --expected-generation-id "${DERIVATION_GENERATION_ID}"
                --composition-baseline "${DERIVATION_BASELINE}"
                --same-observation-derivation "${DERIVATION_FILE}"
                --current-main-root ../bootstrap
                --derivation-journal "${DERIVATION_JOURNAL}"
                --derivation-journal-ref-sha "${DERIVATION_JOURNAL_REF_SHA}"
                --resume-parent-bundle-dir "${RESUME_PARENT_BUNDLE}"
                --resume-parent-archive "${RESUME_PARENT_ARCHIVE}"
                --canonical-parent-bundle-dir "${CANONICAL_PARENT_BUNDLE}"
                --canonical-parent-archive "${CANONICAL_PARENT_ARCHIVE}"
                --canonical-update-pr-helper ../bootstrap/scripts/canonical_update_pr.py
                --canonical-update-journal-schema ../bootstrap/schemas/datapan.canonical-update-promotion-journal.v1.schema.json
              )
            fi
            if [ -n "${RESUME_EVIDENCE}" ] && [ -f "${RESUME_EVIDENCE}" ]; then
              if [ -z "${RESUME_SOURCE_CONTEXT}" ] || [ ! -f "${RESUME_SOURCE_CONTEXT}" ]; then
                echo "FAIL authenticated detail cache lacks its original-A source context" >&2
                exit 2
              fi
              if [ -z "${RESUME_OWNER_ARCHIVE}" ] || [ ! -f "${RESUME_OWNER_ARCHIVE}" ]; then
                echo "FAIL authenticated detail cache lacks its exact retained owner archive" >&2
                exit 2
              fi
              args+=(--resume-enrichment-evidence "${RESUME_EVIDENCE}" --resume-source-context "${RESUME_SOURCE_CONTEXT}" --resume-owner-archive "${RESUME_OWNER_ARCHIVE}")
            fi
            if [ -n "${SOURCE_EPOCH}" ] || [ -n "${SOURCE_TARGET_CONTRACT}" ]; then
              if [ -z "${SOURCE_EPOCH}" ] || [ -z "${SOURCE_TARGET_CONTRACT}" ] || \
                [ ! -f "${SOURCE_EPOCH}" ] || [ ! -f "${SOURCE_TARGET_CONTRACT}" ]; then
                echo "FAIL source epoch and target contract must be supplied together" >&2
                exit 2
              fi
              args+=(--source-epoch "${SOURCE_EPOCH}" --source-target-contract "${SOURCE_TARGET_CONTRACT}")
            fi
            set +e
            python3 ../bootstrap/scripts/process-upstream-catalogue-candidate.py "${args[@]}"
            status="$?"
            set -e
            echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          else
            echo "exit_code=${{ steps.claim.outputs.exit_code }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Terminalize the exact failed processor generation without reprocessing
        if: steps.select.outputs.decision == 'recover'
        id: run_recovery
        working-directory: bootstrap
        env:
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          OUTPUT_DIR: ../datapan-registry/.datapan/ci/upstream-catalogue-processing
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          FAILED_RUN_ID: ${{ steps.select.outputs.recover_failed_run_id }}
          GENERATION_ID: ${{ steps.select.outputs.generation_id }}
          EXPECTED_CHECKPOINT_SHA256: ${{ steps.select.outputs.expected_checkpoint_sha256 }}
          EXPECTED_STATE_HEAD_SHA: ${{ steps.state.outputs.old_sha }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSOR_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PROCESSOR_ARTIFACT_EXPIRES_AT: ${{ steps.expiry.outputs.at }}
          CURRENT_HEAD_SHA: ${{ steps.processor_revision.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          set +e
          python3 scripts/process-upstream-catalogue-candidate.py \
            --source data_go_kr \
            --state-dir "${STATE_DIR}" \
            --output-dir "${OUTPUT_DIR}" \
            --checkpoint-schema schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json \
            --producer-run-id "${PRODUCER_RUN_ID}" \
            --producer-run-url "https://github.com/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" \
            --processor-run-id "${PROCESSOR_RUN_ID}" \
            --processor-artifact-run-id "${PROCESSOR_ARTIFACT_RUN_ID}" \
            --output-artifact-expires-at "${PROCESSOR_ARTIFACT_EXPIRES_AT}" \
            --repository "${REPOSITORY}" \
            --execution-mode live \
            --recover-failed-processor-run-id "${FAILED_RUN_ID}" \
            --recover-failed-generation-id "${GENERATION_ID}" \
            --failed-run-metadata .datapan/ci/failed-processor-recovery/failed-run-metadata.json \
            --failed-artifact-metadata .datapan/ci/failed-processor-recovery/failed-artifact-metadata.json \
            --failed-artifact-dir .datapan/ci/failed-processor-recovery/artifact \
            --expected-checkpoint-sha256 "${EXPECTED_CHECKPOINT_SHA256}" \
            --expected-state-head-sha "${EXPECTED_STATE_HEAD_SHA}" \
            --current-head-sha "${CURRENT_HEAD_SHA}"
          status="$?"
          set -e
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"

      - name: Validate the processor bundle and write a failure receipt if needed
        if: always()
        id: bundle_check
        env:
          DECISION: ${{ steps.select.outputs.decision }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSOR_ARTIFACT_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          REPOSITORY: ${{ github.repository }}
          STATE_HEAD_SHA: ${{ steps.state.outputs.old_sha }}
          CLAIM_SHA: ${{ steps.claim_push.outputs.claim_sha }}
          CLAIM_CHANGED: ${{ steps.claim_push.outputs.changed }}
          CLAIM_OUTCOME: ${{ steps.claim_push.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import hashlib
          import json
          import os
          import pathlib
          import re
          import importlib.util
          import subprocess

          root = pathlib.Path("datapan-registry/.datapan/ci/upstream-catalogue-processing")
          root.mkdir(parents=True, exist_ok=True)
          result_path = root / "upstream-catalogue-processing-result.json"
          if not result_path.is_file():
              fallback = {"status": "idle", "reason": "no_active_generation"} if os.environ.get("DECISION") == "idle" else {"status": "retry", "reason": "processing_result_missing"}
              result_path.write_text(json.dumps(fallback, sort_keys=True) + "\n", encoding="utf-8")
          try:
              result = json.loads(result_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              result = {"status": "retry", "reason": "processing_result_invalid"}
          allowed_statuses = {"ready", "no-change", "retry", "quarantined", "idle"}
          status = result.get("status") if isinstance(result, dict) else None
          generation_id = str(result.get("generation_id") or "") if isinstance(result, dict) else ""
          replay_candidate = bool(
              status == "idle" and not generation_id
              and result.get("reason") == "exact_producer_delivery_replay"
              and result.get("processing_replay") is True
              and result.get("candidate_available") is False
              and result.get("source_id") == "data_go_kr"
              and str(result.get("producer_run_id") or "") == os.environ["PRODUCER_RUN_ID"]
              and result.get("processor_run_id") == os.environ["PROCESSOR_RUN_ID"]
              and str(result.get("processor_artifact_run_id") or "") == os.environ["PROCESSOR_ARTIFACT_RUN_ID"]
          )
          exact_replay = False
          if replay_candidate:
              try:
                  spec = importlib.util.spec_from_file_location(
                      "replay_processor", "bootstrap/scripts/process-upstream-catalogue-candidate.py",
                  )
                  if spec is None or spec.loader is None:
                      raise ValueError("replay_validator_unavailable")
                  processor = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(processor)
                  receipt_path = root / processor.REPLAY_PERSISTENCE_RECEIPT
                  receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
                  old_sha = os.environ.get("STATE_HEAD_SHA", "")
                  claim_sha = os.environ.get("CLAIM_SHA", "")
                  claim_changed = os.environ.get("CLAIM_CHANGED", "")
                  if (
                      os.environ.get("CLAIM_OUTCOME") != "success"
                      or not re.fullmatch(r"[a-f0-9]{40}", claim_sha)
                      or claim_changed not in {"true", "false"}
                  ):
                      raise ValueError("replay_state_cas_missing")
                  state_repo = pathlib.Path("state-repo")
                  verified_receipt = processor.verify_replay_persistence_receipt_from_committed_state(
                      receipt,
                      state_repository=state_repo,
                      prior_state_commit=old_sha,
                      expected_current_state_commit=claim_sha,
                      phase=processor._REPLAY_VERIFY_POST_CAS,
                      result=result,
                  )
                  source_id = verified_receipt["source_id"]
                  replay_generation_id = verified_receipt["generation_id"]
                  checkpoint_rel = f".datapan/upstream-catalogue-state/sources/{source_id}/generations/{replay_generation_id}.json"
                  index_rel = f".datapan/upstream-catalogue-state/sources/{source_id}/index.json"
                  changed_paths = verified_receipt["state_changes"]
                  expected_changed_paths = set()
                  for change in changed_paths:
                      if change.startswith(f"sources/{source_id}/generations/{replay_generation_id}.json#/"):
                          expected_changed_paths.add(checkpoint_rel)
                      elif change.startswith(f"sources/{source_id}/index.json#/"):
                          expected_changed_paths.add(index_rel)
                      else:
                          raise ValueError("replay_state_change_path_invalid")
                  committed_changed_paths = set()
                  if claim_sha != old_sha:
                      completed = subprocess.run(
                          ["git", "-C", str(state_repo), "diff", "--name-only", old_sha, claim_sha],
                          check=True, text=True, capture_output=True,
                      )
                      committed_changed_paths = {path for path in completed.stdout.splitlines() if path}
                  if committed_changed_paths != expected_changed_paths:
                      raise ValueError("replay_state_commit_paths_mismatch")
                  if (
                      (claim_changed == "false" and (claim_sha != old_sha or changed_paths))
                      or (claim_changed == "true" and (claim_sha == old_sha or not changed_paths))
                  ):
                      raise ValueError("replay_state_cas_change_mismatch")
                  exact_replay = True
              except Exception as exc:
                  print(f"FAIL replay CAS verification: {type(exc).__name__}: {exc}", file=__import__("sys").stderr)
          replay = exact_replay
          verified = exact_replay or (
              status == "idle" and not generation_id
              and os.environ.get("DECISION") == "idle"
              and result.get("reason") == "no_active_generation"
          )
          if status not in allowed_statuses:
              status = "retry"
              result = {"status": status, "reason": "nonterminal_processor_result"}
          if generation_id and not re.fullmatch(r"[a-f0-9]{64}", generation_id):
              status = "retry"
              generation_id = ""
              result = {"status": status, "reason": "processor_generation_id_invalid"}
          checkpoint_path = root / "upstream-catalogue-checkpoint-receipt.json"
          checkpoint = None
          if generation_id and checkpoint_path.is_file():
              try:
                  checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
                  unsigned = dict(checkpoint)
                  claimed = unsigned.pop("checkpoint_sha256")
                  canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
                  valid_checkpoint = (
                      hashlib.sha256(canonical).hexdigest() == claimed
                      and checkpoint.get("generation_id") == generation_id
                      and checkpoint.get("status") == status
                  )
              except (OSError, KeyError, TypeError, json.JSONDecodeError):
                  valid_checkpoint = False
              if valid_checkpoint:
                  locator = checkpoint.get("output_artifact") if isinstance(checkpoint.get("output_artifact"), dict) else {}
                  entries = checkpoint.get("output_digests") if isinstance(checkpoint.get("output_digests"), list) else []
                  current_locator = (
                      locator.get("repository") == os.environ["REPOSITORY"]
                      and str(locator.get("run_id")) == os.environ["PROCESSOR_ARTIFACT_RUN_ID"]
                      and locator.get("name") == f"upstream-catalogue-processing-{os.environ['PROCESSOR_RUN_ID']}"
                      and locator.get("artifact_id") is None
                  )
                  ready_bundle_paths = [
                      "composed-candidate.registry.json", "ready-scope.registry.json", "semantic-diff.json",
                      "regeneration-queue.json", "quarantine.json", "composition-receipt.json",
                      "upstream-catalogue-original-candidate.registry.json",
                      "upstream-catalogue-cache-source-context.json",
                      "upstream-catalogue-enrichment-evidence.json", "upstream-catalogue-processing-result.json",
                  ]
                  marker_quarantine_paths = ["upstream-catalogue-processing-result.json"]
                  allowed_paths = set(ready_bundle_paths)
                  file_digests_valid = True
                  for entry in entries:
                      if (
                          not isinstance(entry, dict) or set(entry) != {"path", "sha256", "bytes"}
                          or not isinstance(entry.get("path"), str) or entry["path"] not in allowed_paths
                      ):
                          file_digests_valid = False
                          break
                      path = root / entry["path"]
                      if (
                          not isinstance(entry.get("bytes"), int) or isinstance(entry.get("bytes"), bool)
                          or not isinstance(entry.get("sha256"), str)
                          or not path.is_file() or path.is_symlink() or path.stat().st_size != entry["bytes"]
                          or hashlib.sha256(path.read_bytes()).hexdigest() != entry["sha256"]
                      ):
                          file_digests_valid = False
                          break
                  manifest = hashlib.sha256(json.dumps(entries, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest() if entries else None
                  valid_manifest = locator.get("bundle_manifest_sha256") == manifest
                  entry_paths = [entry.get("path") for entry in entries if isinstance(entry, dict)]
                  result_identity_valid = bool(
                      isinstance(result, dict)
                      and result.get("processing_replay") is False
                      and result.get("source_id") == "data_go_kr"
                      and str(result.get("producer_run_id") or "") == os.environ["PRODUCER_RUN_ID"]
                      and result.get("processor_run_id") == os.environ["PROCESSOR_RUN_ID"]
                      and str(result.get("processor_artifact_run_id") or "") == os.environ["PROCESSOR_ARTIFACT_RUN_ID"]
                      and result.get("candidate_available") is (status == "ready")
                      and result.get("generation_id") == generation_id
                  )
                  if status == "ready":
                      composition_path = root / "composition-receipt.json"
                      try:
                          composition_status = json.loads(composition_path.read_text(encoding="utf-8")).get("status")
                      except (OSError, json.JSONDecodeError, AttributeError):
                          composition_status = None
                      valid_ready = (
                          current_locator and result_identity_valid and file_digests_valid and valid_manifest
                          and entry_paths == ready_bundle_paths
                          and (root / "ready-scope.registry.json").is_file()
                          and composition_status in {"ready", "ready_scoped"}
                      )
                      verified = bool(valid_checkpoint and valid_ready)
                  elif status == "no-change":
                      composition_path = root / "composition-receipt.json"
                      try:
                          composition = json.loads(composition_path.read_text(encoding="utf-8"))
                          composition_status = composition.get("status")
                      except (OSError, json.JSONDecodeError, AttributeError):
                          composition = {}
                          composition_status = None
                      outcome = checkpoint.get("outcome") if isinstance(checkpoint.get("outcome"), dict) else {}
                      verified = bool(
                          valid_checkpoint and current_locator and result_identity_valid and file_digests_valid and valid_manifest
                          and entry_paths == ready_bundle_paths
                          and composition_status == "no_change"
                          and int(outcome.get("pending_count", 0) or 0) == 0
                          and int(outcome.get("detail_retry_count", 0) or 0) == 0
                      )
                  else:
                      valid_full_result = bool(
                          result_identity_valid and entry_paths == ready_bundle_paths
                      )
                      valid_marker_quarantine = bool(
                          status == "quarantined"
                          and result_identity_valid
                          and result.get("candidate_available") is False
                          and entry_paths == marker_quarantine_paths
                      )
                      verified = bool(
                          valid_checkpoint and current_locator and file_digests_valid and valid_manifest
                          and (valid_full_result or valid_marker_quarantine)
                      )
          if generation_id and checkpoint is None:
              verified = False
          if status in {"ready", "no-change"} and not verified:
              status = "retry"
              result = {"status": status, "reason": "processor_bundle_or_checkpoint_verification_failed", "generation_id": generation_id or None}
          elif status == "idle" and not verified:
              status = "retry"
              result = {"status": status, "reason": "processor_noop_verification_failed"}
          elif generation_id and status == "quarantined" and not verified:
              status = "retry"
              result = {"status": status, "reason": "processor_bundle_or_checkpoint_verification_failed", "generation_id": generation_id}
          elif isinstance(result, dict) and result.get("status") not in allowed_statuses:
              result = {"status": status, "reason": "nonterminal_processor_result", "generation_id": generation_id or None}
          result_path.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"verified={str(verified).lower()}")
          print(f"replay={str(replay).lower()}")
          print(f"candidate_available={str(status == 'ready' and verified).lower()}")
          print(f"status={status}")
          print(f"generation_id={generation_id}")
          PY

      - name: Ensure the processor artifact contains an actionable result
        if: always()
        env:
          BUNDLE_CHECK_OUTCOME: ${{ steps.bundle_check.outcome }}
          BUNDLE_CHECK_VERIFIED: ${{ steps.bundle_check.outputs.verified }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          root = pathlib.Path("datapan-registry/.datapan/ci/upstream-catalogue-processing")
          root.mkdir(parents=True, exist_ok=True)
          path = root / "upstream-catalogue-processing-result.json"
          try:
              result = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              result = {"status": "retry", "reason": "processing_result_unavailable"}
          if not isinstance(result, dict):
              result = {"status": "retry", "reason": "processing_result_invalid"}
          reason = None
          if os.environ.get("BUNDLE_CHECK_OUTCOME") != "success":
              reason = "processor_bundle_check_failed"
          elif os.environ.get("BUNDLE_CHECK_VERIFIED") != "true":
              reason = "processor_bundle_not_verified"
          if reason:
              result = {"status": "retry", "reason": reason, "generation_id": result.get("generation_id")}
              path.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload processor result and composed candidate bundle
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-catalogue-processing-${{ github.run_id }}-${{ github.run_attempt }}
          path: datapan-registry/.datapan/ci/upstream-catalogue-processing/
          if-no-files-found: error
          retention-days: 30

      - name: Bind exact uploaded artifact and compare-and-swap final checkpoint
        if: always() && steps.select.outputs.decision == 'process' && steps.upload.outputs['artifact-id'] != '' && steps.bundle_check.outputs.verified == 'true' && steps.bundle_check.outputs.generation_id != '' && steps.bundle_check.outputs.replay != 'true' && steps.claim_push.outputs.claim_sha != ''
        id: bind_push
        continue-on-error: true
        working-directory: datapan-registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSOR_ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: upstream-catalogue-processing-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          STATE_BRANCH: automation/upstream-catalogue-state
          CLAIM_SHA: ${{ steps.claim_push.outputs.claim_sha }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          generation_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("generation_id") or "")' .datapan/ci/upstream-catalogue-processing/upstream-catalogue-processing-result.json)"
          [[ "${generation_id}" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/${REPOSITORY}/actions/runs/${PROCESSOR_ARTIFACT_RUN_ID}/artifacts?per_page=100" > .datapan/ci/upstream-catalogue-processing-artifact-metadata.json
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import datetime as dt
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(".datapan/ci/upstream-catalogue-processing-artifact-metadata.json").read_text(encoding="utf-8"))
          matches = [row for row in payload.get("artifacts", []) if str(row.get("id")) == os.environ["ARTIFACT_ID"] and row.get("name") == os.environ["ARTIFACT_NAME"]]
          if len(matches) != 1 or str(matches[0].get("workflow_run", {}).get("id")) != os.environ["PROCESSOR_ARTIFACT_RUN_ID"]:
              raise SystemExit("FAIL uploaded processor artifact locator does not match Actions metadata")
          artifact = matches[0]
          expires_at = str(artifact.get("expires_at", ""))
          if artifact.get("expired") or not expires_at:
              raise SystemExit("FAIL uploaded processor artifact is expired or lacks expiry metadata")
          if dt.datetime.fromisoformat(expires_at.replace("Z", "+00:00")) <= dt.datetime.now(dt.timezone.utc):
              raise SystemExit("FAIL uploaded processor artifact expired before checkpoint binding")
          Path(".datapan/ci/upstream-catalogue-processing-artifact-locator.json").write_text(
              json.dumps({"artifact_id": os.environ["ARTIFACT_ID"], "expires_at": expires_at}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"expires_at={expires_at}")
          PY
          python3 ../bootstrap/scripts/process-upstream-catalogue-candidate.py \
            --source data_go_kr \
            --state-dir "${STATE_DIR}" \
            --checkpoint-schema ../bootstrap/schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json \
            --processor-run-id "${PROCESSOR_RUN_ID}" \
            --processor-artifact-run-id "${PROCESSOR_ARTIFACT_RUN_ID}" \
            --bind-output-artifact-id "${ARTIFACT_ID}" \
            --bind-output-artifact-expires-at "$(python3 -c 'import json; print(json.load(open(".datapan/ci/upstream-catalogue-processing-artifact-locator.json", encoding="utf-8"))["expires_at"])')" \
            --bind-generation-id "${generation_id}"
          python3 ../bootstrap/scripts/upstream-catalogue-state-branch.py commit-push \
            --worktree ../state-repo --remote origin --branch "${STATE_BRANCH}" \
            --repository "${REPOSITORY}" --expected-old-sha "${CLAIM_SHA}" \
            --message "Bind upstream catalogue processing artifact" \
            --result .datapan/ci/upstream-catalogue-final-push.json
          echo "published=true" >> "${GITHUB_OUTPUT}"

      - name: Bind recovery artifact and compare-and-swap terminal checkpoint
        if: always() && steps.select.outputs.decision == 'recover' && steps.upload.outputs['artifact-id'] != '' && steps.bundle_check.outputs.verified == 'true' && steps.bundle_check.outputs.generation_id != ''
        id: bind_recovery
        continue-on-error: true
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROCESSOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROCESSOR_ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: upstream-catalogue-processing-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          STATE_DIR: ../state-repo/.datapan/upstream-catalogue-state
          STATE_BRANCH: automation/upstream-catalogue-state
          OUTPUT_DIR: ../datapan-registry/.datapan/ci/upstream-catalogue-processing
          EXPECTED_STATE_HEAD_SHA: ${{ steps.state.outputs.old_sha }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          generation_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("generation_id") or "")' "${OUTPUT_DIR}/upstream-catalogue-processing-result.json")"
          [[ "${generation_id}" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/${REPOSITORY}/actions/runs/${PROCESSOR_ARTIFACT_RUN_ID}/artifacts?per_page=100" > .datapan/ci/recovery-processor-artifact-metadata.json
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import datetime as dt
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(".datapan/ci/recovery-processor-artifact-metadata.json").read_text(encoding="utf-8"))
          matches = [row for row in payload.get("artifacts", []) if str(row.get("id")) == os.environ["ARTIFACT_ID"] and row.get("name") == os.environ["ARTIFACT_NAME"]]
          if len(matches) != 1 or str(matches[0].get("workflow_run", {}).get("id")) != os.environ["PROCESSOR_ARTIFACT_RUN_ID"]:
              raise SystemExit("FAIL uploaded recovery artifact locator does not match Actions metadata")
          artifact = matches[0]
          expires_at = str(artifact.get("expires_at", ""))
          if artifact.get("expired") or not expires_at or dt.datetime.fromisoformat(expires_at.replace("Z", "+00:00")) <= dt.datetime.now(dt.timezone.utc):
              raise SystemExit("FAIL uploaded recovery artifact expired before checkpoint binding")
          Path(".datapan/ci/recovery-processor-artifact-locator.json").write_text(
              json.dumps({"artifact_id": os.environ["ARTIFACT_ID"], "expires_at": expires_at}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"expires_at={expires_at}")
          PY
          python3 scripts/process-upstream-catalogue-candidate.py \
            --source data_go_kr --state-dir "${STATE_DIR}" \
            --checkpoint-schema schemas/datapan.upstream-catalogue-checkpoint.v1.schema.json \
            --processor-run-id "${PROCESSOR_RUN_ID}" --processor-artifact-run-id "${PROCESSOR_ARTIFACT_RUN_ID}" \
            --bind-output-artifact-id "${ARTIFACT_ID}" \
            --bind-output-artifact-expires-at "$(python3 -c 'import json; print(json.load(open(".datapan/ci/recovery-processor-artifact-locator.json", encoding="utf-8"))["expires_at"])')" \
            --bind-generation-id "${generation_id}"
          python3 scripts/upstream-catalogue-state-branch.py commit-push \
            --worktree ../state-repo --remote origin --branch "${STATE_BRANCH}" \
            --repository "${REPOSITORY}" --expected-old-sha "${EXPECTED_STATE_HEAD_SHA}" \
            --message "Record verified failed processor recovery" \
            --result .datapan/ci/recovery-state-push.json
          echo "published=true" >> "${GITHUB_OUTPUT}"

      - name: Publish processing status
        if: always()
        id: publish_result
        env:
          DECISION: ${{ steps.select.outputs.decision }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.head_sha }}
          PROCESSOR_HEAD_SHA: ${{ steps.processor_revision.outputs.head_sha }}
        run: |
          set -euo pipefail
          result=datapan-registry/.datapan/ci/upstream-catalogue-processing/upstream-catalogue-processing-result.json
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", "retry"))' "${result}")"
          generation="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("generation_id", ""))' "${result}")"
          artifact_name="upstream-catalogue-processing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state_publication_status=interrupted
          if [ "${DECISION}" = "idle" ]; then
            state_publication_status=not_required
          elif [ "${{ steps.bundle_check.outputs.replay }}" = "true" ] && [ "${{ steps.bundle_check.outputs.verified }}" = "true" ] && [ "${{ steps.claim_push.outcome }}" = "success" ] && [ "${{ steps.claim_push.outputs.changed }}" = "true" ]; then
            state_publication_status=replay_recorded
          elif [ "${{ steps.bundle_check.outputs.replay }}" = "true" ] && [ "${{ steps.bundle_check.outputs.verified }}" = "true" ] && [ "${{ steps.claim_push.outcome }}" = "success" ]; then
            state_publication_status=replay_unmodified
          elif [ "${{ steps.bind_push.outputs.published }}" = "true" ] || [ "${{ steps.bind_recovery.outputs.published }}" = "true" ]; then
            state_publication_status=published
          elif [ "${{ steps.claim_push.outcome }}" = "success" ] && [ "${{ steps.claim_push.outputs.changed }}" = "true" ] && [ "${{ steps.bundle_check.outputs.verified }}" != "true" ]; then
            state_publication_status=checkpoint_recorded
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "generation_id=${generation}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "state_publication_status=${state_publication_status}" >> "${GITHUB_OUTPUT}"
          result_state_sha="${{ steps.state.outputs.old_sha }}"
          if [ "${state_publication_status}" = "published" ] || \
            [ "${state_publication_status}" = "checkpoint_recorded" ] || \
            [ "${state_publication_status}" = "replay_recorded" ]; then
            candidate_state_sha="$(git -C state-repo rev-parse HEAD)"
            if [[ "${candidate_state_sha}" =~ ^[a-f0-9]{40}$ ]]; then
              result_state_sha="${candidate_state_sha}"
            fi
          fi
          echo "result_state_sha=${result_state_sha}" >> "${GITHUB_OUTPUT}"
          echo "processing_replay=${{ steps.bundle_check.outputs.replay }}" >> "${GITHUB_OUTPUT}"
          echo "candidate_available=${{ steps.bundle_check.outputs.candidate_available }}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Upstream catalogue processing"
            echo
            echo "- status: \`${status}\`"
            echo "- generation: \`${generation:-none}\`"
            echo "- processor artifact: \`${artifact_name}\`"
            echo "- durable processor receipt: \`${state_publication_status}\`"
            echo "- trusted processor source commit: \`${PROCESSOR_HEAD_SHA:-unavailable}\`"
            echo "- producer input source commit: \`${PRODUCER_HEAD_SHA:-unavailable}\`"
            echo "- catalogue publication: \`false\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          checkpoint=datapan-registry/.datapan/ci/upstream-catalogue-processing/upstream-catalogue-checkpoint-receipt.json
          if [ -f "${checkpoint}" ]; then
            python3 - "${checkpoint}" >> "${GITHUB_STEP_SUMMARY}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              receipt = json.load(handle)
          inputs = receipt.get("generation_inputs") or {}
          print("- digest-bound generation inputs:")
          for name, label in (
              ("baseline_sha256", "producer baseline"),
              ("policy_sha256", "producer source policy"),
              ("adapter_revision", "producer provider adapter index"),
              ("generator_revision", "trusted processor code"),
              ("extractor_revision", "trusted detail extractor"),
          ):
              value = inputs.get(name)
              print(f"  - {label}: `{value or 'unavailable'}`")
          PY
          else
            echo "- digest-bound generation inputs: unavailable (no checkpoint receipt)" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Build retained source recovery result
        if: always() && steps.source_recovery.outcome == 'success' && steps.publish_result.outcome == 'success'
        id: source_recovery_result
        env:
          SOURCE_WORK_REQUEST: ${{ steps.source_recovery.outputs.request_path }}
          PROCESSING_RESULT: datapan-registry/.datapan/ci/upstream-catalogue-processing/upstream-catalogue-processing-result.json
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PROCESSOR_HEAD_SHA: ${{ steps.processor_revision.outputs.head_sha }}
          DECISION: ${{ steps.select.outputs.decision }}
          SELECTED_GENERATION_ID: ${{ steps.select.outputs.generation_id }}
          SELECTED_PRODUCER_RUN_ID: ${{ steps.select.outputs.producer_run_id }}
          PERSISTENCE_STATUS: ${{ steps.publish_result.outputs.state_publication_status }}
          RESULT_STATE_SHA: ${{ steps.publish_result.outputs.result_state_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          bootstrap = pathlib.Path("bootstrap").resolve()
          sys.path.insert(0, str(bootstrap / "scripts"))
          import upstream_catalogue_source_eligibility as source_eligibility

          request_path = bootstrap / os.environ["SOURCE_WORK_REQUEST"]
          processing_path = pathlib.Path(os.environ["PROCESSING_RESULT"])
          request = json.loads(request_path.read_text(encoding="utf-8"))
          processing = json.loads(processing_path.read_text(encoding="utf-8"))
          result = source_eligibility.build_source_recovery_result(
              request,
              processing,
              root=bootstrap,
              repository=os.environ["REPOSITORY"],
              event=os.environ["EVENT_NAME"],
              run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              head_sha=os.environ["PROCESSOR_HEAD_SHA"],
              decision=os.environ["DECISION"],
              selected_generation_id=os.environ.get("SELECTED_GENERATION_ID") or None,
              selected_producer_run_id=os.environ.get("SELECTED_PRODUCER_RUN_ID") or None,
              persistence_status=os.environ["PERSISTENCE_STATUS"],
              result_state_sha=os.environ.get("RESULT_STATE_SHA") or None,
          )
          output = bootstrap / ".datapan/ci/upstream-catalogue-source-recovery/source-recovery-result.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload retained source recovery result
        if: always() && steps.source_recovery_result.outcome == 'success'
        id: source_recovery_upload
        uses: actions/upload-artifact@v7
        with:
          name: upstream-catalogue-source-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap/.datapan/ci/upstream-catalogue-source-recovery/source-recovery-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail non-ready or interrupted processing runs after receipts are uploaded
        if: >-
          always() &&
          (steps.upload.outcome != 'success' ||
           (steps.publish_result.outputs.status != 'ready' && steps.publish_result.outputs.status != 'no-change' && steps.publish_result.outputs.status != 'idle' && !(steps.publish_result.outputs.status == 'quarantined' && steps.publish_result.outputs.candidate_available == 'false' && steps.bundle_check.outputs.verified == 'true' && steps.publish_result.outputs.state_publication_status == 'published')) ||
           (steps.publish_result.outputs.state_publication_status != 'published' && steps.publish_result.outputs.state_publication_status != 'not_required' && !(steps.publish_result.outputs.status == 'idle' && steps.publish_result.outputs.processing_replay == 'true' && (steps.publish_result.outputs.state_publication_status == 'replay_recorded' || steps.publish_result.outputs.state_publication_status == 'replay_unmodified'))) ||
           (steps.source_recovery.outcome == 'success' && (steps.source_recovery_result.outcome != 'success' || steps.source_recovery_upload.outcome != 'success')))
        run: exit 1
