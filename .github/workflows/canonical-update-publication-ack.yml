name: Canonical update publication acknowledgement

on:
  workflow_run:
    workflows: ["Publish Hugging Face Registry distribution"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: canonical-update-publication-ack
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install acknowledgement validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Locate an immutable publication receipt artifact
        id: publication-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLICATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p .datapan
          gh api "repos/${GH_REPO}/actions/runs/${PUBLICATION_RUN_ID}/artifacts" > .datapan/publication-artifacts.json
          artifact_id="$(jq -r '[.artifacts[] | select(.name == "huggingface-registry-publication-receipts" and .expired == false)] | if length == 1 then .[0].id else empty end' .datapan/publication-artifacts.json)"
          if [ -z "$artifact_id" ]; then
            echo "has_receipt=false" >> "$GITHUB_OUTPUT"
            echo "No #592 publication receipt artifact; this was a validation or non-publishing run."
            exit 0
          fi
          echo "has_receipt=true" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download the exact #592 receipt artifact
        if: steps.publication-artifact.outputs.has_receipt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLICATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download "$PUBLICATION_RUN_ID" --repo "$GH_REPO" --name huggingface-registry-publication-receipts --dir .datapan/publication-input
          receipt="$(find .datapan/publication-input -type f -name hf-publication-receipt.json -print -quit)"
          test -n "$receipt" || { echo "The publication artifact has no exact #592 receipt" >&2; exit 1; }
          echo "PUBLICATION_RECEIPT=$receipt" >> "$GITHUB_ENV"

      - name: Reconcile publication and anonymous read-back evidence
        if: steps.publication-artifact.outputs.has_receipt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/run-canonical-update-promotion.py --mode reconcile-publication --publication-receipt "$PUBLICATION_RECEIPT"
