name: Canonical update publication acknowledgement

on:
  schedule:
    - cron: "57 * * * *"
  workflow_run:
    workflows: ["Publish Hugging Face Registry distribution"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: canonical-update-publication-ack
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install publication acknowledgement dependencies
        run: python -m pip install --disable-pip-version-check jsonschema 'PyYAML==6.0.2'

      - name: Recover one verified publication acknowledgement without republishing
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/recover-canonical-publication-ack.py --repository-root .

      - name: Upload bounded acknowledgement recovery summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-publication-ack-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .datapan/publication-ack-recovery-summary.json
          if-no-files-found: warn
          retention-days: 30
