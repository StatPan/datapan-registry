name: Verify registry release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    # Weekly release-health check, Monday 18:17 UTC / Tuesday 03:17 KST.
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v7
        with:
          path: datapan-registry
          lfs: true

      - name: Checkout CLI
        uses: actions/checkout@v7
        with:
          repository: StatPan/datapan-cli
          path: datapan-cli

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: datapan-cli/go.mod
          check-latest: true
          cache-dependency-path: datapan-cli/go.sum

      - name: Confirm registry LFS file is materialized
        run: |
          bytes="$(wc -c < datapan-registry/data/data-go-kr.registry.json)"
          echo "data-go-kr.registry.json bytes=${bytes}"
          test "${bytes}" -gt 100000000

      - name: Validate registry policy artifacts
        working-directory: datapan-registry
        run: |
          python3 -m venv .datapan/ci/source-profile-venv
          . .datapan/ci/source-profile-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install jsonschema
          python scripts/sync-release-schema-artifacts.py --check
          python scripts/sync-release-manifest-artifacts.py --check
          python scripts/validate-release-ledger-ownership.py
          python scripts/validate-release-ledger-goal-audit.py
          python scripts/generate-release-assembly-receipt.py --check
          python scripts/validate-coverage-backlog.py
          python scripts/validate-external-adapter-backlog.py
          python scripts/validate-source-profiles.py
          python scripts/generate-source-contract-rollup.py --check
          python scripts/validate-source-contract-rollups.py
          python scripts/validate-error-action-catalogs.py
          python scripts/generate-error-action-routing-rollup.py --check
          python scripts/validate-error-action-routing-rollups.py
          python scripts/validate-external-coverage.py
          python scripts/generate-impact-plan-rollup.py --check
          python scripts/validate-impact-plans.py
          python scripts/validate-source-reference-drift.py
          python scripts/validate-source-report-inventory.py
          python scripts/validate-release-report-artifacts.py
          python scripts/validate-release-receipt-boundary.py
          python scripts/validate-source-runtime-candidates.py
          python scripts/validate-source-runtime-evidence-plans.py
          python scripts/validate-source-runtime-evidence-rollup.py
          python scripts/validate-runtime-evidence-growth.py
          python scripts/validate-operation-materialization-plan.py
          python scripts/validate-safetydata-operation-candidates.py
          python scripts/validate-safetydata-registry-patches.py
          python scripts/validate-link-detail-registry-patches.py
          python scripts/validate-institution-api-overview.py
          python scripts/validate-institution-runtime-plan.py
          python scripts/generate-source-runtime-remediation-map.py --check
          python scripts/generate-credential-runtime-evidence-policy.py --check
          python scripts/validate-credential-runtime-receipts.py
          python scripts/generate-credential-runtime-receipt-collection-queue.py --check
          python scripts/generate-credential-runtime-review-handoff.py --check
          python scripts/validate-credential-runtime-manual-review-decision.py
          python scripts/generate-credential-runtime-manual-review-acceptance.py --check
          python scripts/run-credential-runtime-collection.py --self-test
          python scripts/run-credential-runtime-collection.py --check
          python scripts/promote-credential-runtime-receipt.py --self-test
          python scripts/generate-release-distribution-footprint.py --check
          python scripts/generate-release-consumer-compatibility.py --check
          python scripts/validate-release-consumer-compatibility.py
          python scripts/generate-release-consumer-decision.py --check
          python -m py_compile scripts/error_action_routing_rollup.py
          python -m py_compile scripts/generate-error-action-routing-rollup.py
          python -m py_compile scripts/generate-source-contract-rollup.py
          python -m py_compile scripts/sync-release-manifest-artifacts.py
          python -m py_compile scripts/generate-release-distribution-footprint.py
          python -m py_compile scripts/generate-release-consumer-compatibility.py
          python -m py_compile scripts/generate-release-consumer-decision.py
          python -m py_compile scripts/generate-release-assembly-receipt.py
          python -m py_compile scripts/generate-credential-runtime-evidence-policy.py
          python -m py_compile scripts/generate-credential-runtime-receipt-collection-queue.py
          python -m py_compile scripts/generate-credential-runtime-review-handoff.py
          python -m py_compile scripts/validate-credential-runtime-manual-review-decision.py
          python -m py_compile scripts/generate-credential-runtime-manual-review-acceptance.py
          python -m py_compile scripts/run-credential-runtime-collection.py
          python -m py_compile scripts/promote-credential-runtime-receipt.py
          python -m py_compile scripts/validate-credential-runtime-receipts.py
          python -m py_compile scripts/generate-source-runtime-remediation-map.py
          python -m py_compile scripts/source_contract_rollup.py
          python -m py_compile scripts/validate-error-action-routing-rollups.py
          python -m py_compile scripts/validate-source-contract-rollups.py
          python -m py_compile scripts/validate-doctor-smoke-summaries.py
          python -m py_compile scripts/validate-install-smoke-summaries.py
          python -m py_compile scripts/validate-release-consumer-compatibility.py
          python -m py_compile scripts/validate-release-ledger-ownership.py
          python -m py_compile scripts/validate-release-ledger-goal-audit.py
          python -m py_compile scripts/validate-release-report-artifacts.py
          python -m py_compile scripts/validate-release-receipt-boundary.py
          python -m py_compile scripts/release_health_rollup.py
          python -m py_compile scripts/generate-release-health-rollup.py
          python -m py_compile scripts/validate-release-health-rollups.py

      - name: Validate provider verification evidence
        working-directory: datapan-cli
        run: |
          mkdir -p ../datapan-registry/.datapan/ci/provider-summaries
          for provider in qnet epost ekape emuseum forest folk garak gblib airport andong culture data-gg happysd i815 jeonju geoje gwanak humetro itfind korad kpx lh-ebid mafra myhome naqs ncpms nfqs nongsaro oneclick-law pqis seoul-bus seoul-open-data sisul tour uiryeong ulsan work24; do
            go run ./cmd/datapan catalog verify summary \
              --input "../datapan-registry/reports/${provider}-verification.json" \
              --output "../datapan-registry/.datapan/ci/provider-summaries/${provider}-verification-summary.json" \
              --json
          done
          go run ./cmd/datapan catalog verify summary \
            --input ../datapan-registry/reports/latest-verification.json \
            --output ../datapan-registry/.datapan/ci/latest-verification-summary.json \
            --json

      - name: Verify release manifest
        working-directory: datapan-cli
        run: |
          mkdir -p ../datapan-registry/.datapan/ci
          go run ./cmd/datapan catalog release verify \
            --manifest ../datapan-registry/manifest.json \
            --output ../datapan-registry/.datapan/ci/latest-release-verification.json \
            --json

      - name: Check release readiness
        working-directory: datapan-cli
        run: |
          go run ./cmd/datapan catalog release readiness \
            --manifest ../datapan-registry/manifest.json \
            --output ../datapan-registry/.datapan/ci/latest-release-readiness.json \
            --json

      - name: Validate full registry shard release evidence
        working-directory: datapan-registry
        run: |
          . .datapan/ci/source-profile-venv/bin/activate
          mkdir -p .datapan/ci
          python scripts/generate-registry-shards.py \
            --source-registry data/data-go-kr.registry.json \
            --output-dir .datapan/ci/full-registry-shards \
            --manifest manifest.json \
            --generated-at "$(jq -r '.generated_at' manifest.json)" \
            --clean
          python scripts/validate-registry-shards.py \
            .datapan/ci/full-registry-shards/registry-shards.json
          python scripts/package-registry-shards.py \
            --shard-dir .datapan/ci/full-registry-shards \
            --output .datapan/ci/full-data-go-kr-shards.tar.gz
          python scripts/package-registry-shards.py \
            --check .datapan/ci/full-data-go-kr-shards.tar.gz \
            | tee .datapan/ci/full-shard-archive-check.txt

      - name: Package current release zip
        working-directory: datapan-registry
        run: |
          mkdir -p .datapan/ci .datapan/release-assets
          python scripts/package-registry-release.py \
            --manifest manifest.json \
            --output .datapan/release-assets/datapan-registry-snapshot.zip
          python scripts/package-registry-release.py \
            --check .datapan/release-assets/datapan-registry-snapshot.zip \
            | tee .datapan/ci/current-release-zip-check.txt
          python scripts/package-registry-release.py \
            --check .datapan/release-assets/datapan-registry-snapshot.zip \
            --shard-archive .datapan/ci/full-data-go-kr-shards.tar.gz \
            | tee .datapan/ci/current-release-shard-consistency-check.txt

      - name: Check current release zip is installable
        working-directory: datapan-cli
        run: |
          mkdir -p ../datapan-registry/.datapan/ci
          port="$(
            python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()'
          )"
          python3 -m http.server "${port}" \
            --bind 127.0.0.1 \
            --directory ../datapan-registry/.datapan/release-assets \
            > ../datapan-registry/.datapan/ci/current-release-http.log 2>&1 &
          server_pid="$!"
          trap 'kill "${server_pid}" >/dev/null 2>&1 || true' EXIT

          url="http://127.0.0.1:${port}/datapan-registry-snapshot.zip"
          for attempt in $(seq 1 30); do
            if curl -fsSI "${url}" >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "current release zip HTTP server did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          go run ./cmd/datapan catalog install datapan-registry \
            --registry "${RUNNER_TEMP}/datapan-installed-current.registry.json" \
            --url "${url}" \
            --json \
            > ../datapan-registry/.datapan/ci/current-release-install.json
          python3 ../datapan-registry/scripts/check-shard-aware-install-smoke.py \
            --release-zip ../datapan-registry/.datapan/release-assets/datapan-registry-snapshot.zip \
            --summary-json ../datapan-registry/.datapan/ci/current-release-install-smoke.json \
            ../datapan-registry/.datapan/ci/current-release-install.json
          ../datapan-registry/.datapan/ci/source-profile-venv/bin/python \
            ../datapan-registry/scripts/validate-install-smoke-summaries.py \
            --schema ../datapan-registry/schemas/datapan.install-smoke-summary.v1.schema.json \
            ../datapan-registry/.datapan/ci/current-release-install-smoke.json
          DATAPAN_REGISTRY_PATH="${RUNNER_TEMP}/datapan-installed-current.registry.json" \
            go run ./cmd/datapan doctor --json \
            > ../datapan-registry/.datapan/ci/current-release-doctor.json
          python3 ../datapan-registry/scripts/check-release-doctor-smoke.py \
            --install-json ../datapan-registry/.datapan/ci/current-release-install.json \
            --summary-json ../datapan-registry/.datapan/ci/current-release-doctor-smoke.json \
            ../datapan-registry/.datapan/ci/current-release-doctor.json
          ../datapan-registry/.datapan/ci/source-profile-venv/bin/python \
            ../datapan-registry/scripts/validate-doctor-smoke-summaries.py \
            --schema ../datapan-registry/schemas/datapan.doctor-smoke-summary.v1.schema.json \
            ../datapan-registry/.datapan/ci/current-release-doctor-smoke.json

      - name: Check README current snapshot
        run: |
          readme="datapan-registry/README.md"
          coverage="datapan-registry/reports/coverage.json"
          verification="datapan-registry/reports/latest-verification-summary.json"
          provider_index="datapan-registry/data/provider-index.json"

          specs="$(jq -r '.summary.specs' "${coverage}")"
          operations="$(jq -r '.summary.operations' "${coverage}")"
          callable_operations="$(jq -r '.summary.callable_operations' "${coverage}")"
          callable_percent="$(jq -r '.summary.callable_operation_percent' "${coverage}")"
          registered_adapter_operations="$(jq -r '.summary.registered_adapter_operations' "${coverage}")"
          external_endpoint_operations="$(jq -r '.summary.external_endpoint_operations' "${coverage}")"
          external_adapter_percent="$(jq -r '.summary.external_adapter_coverage_percent' "${coverage}")"
          missing_adapter_hosts="$(jq -r '.summary.missing_adapter_hosts' "${coverage}")"
          split_status="$(jq -r '.split_readiness.status' "${provider_index}")"
          adapter_count="$(jq -r '.split_readiness.adapter_count' "${provider_index}")"
          verification_adapters="$(jq -r '.split_readiness.verification_capable_adapters' "${provider_index}")"
          call_adapters="$(jq -r '.split_readiness.call_capable_adapters' "${provider_index}")"
          evidence_total="$(jq -r '.summary.total' "${verification}")"
          evidence_verified="$(jq -r '.summary.verified' "${verification}")"
          evidence_failed="$(jq -r '.summary.failed' "${verification}")"
          evidence_skipped="$(jq -r '.summary.skipped' "${verification}")"

          grep -F -- "- Specs: \`${specs}\`" "${readme}"
          grep -F -- "- Operations: \`${operations}\`" "${readme}"
          grep -F -- "- Callable operations: \`${callable_operations}\` (\`${callable_percent}%\`)" "${readme}"
          grep -F -- "- External adapter coverage: \`${registered_adapter_operations}\` registered-adapter operations out of \`${external_endpoint_operations}\`" "${readme}"
          grep -F -- "external endpoint operations (\`${external_adapter_percent}%\`)" "${readme}"
          grep -F -- "- Missing external adapter hosts: \`${missing_adapter_hosts}\`" "${readme}"
          grep -F -- "- Provider split readiness: \`${split_status}\`" "${readme}"
          grep -F -- "(\`${adapter_count}\` adapters, \`${verification_adapters}\` verification-capable, \`${call_adapters}\` call-capable)" "${readme}"
          grep -F -- "- Runtime verification evidence: \`${evidence_total}\` bounded checks merged into" "${readme}"
          grep -F -- "\`${evidence_verified}\` verified, \`${evidence_failed}\` failed, \`${evidence_skipped}\`" "${readme}"

      - name: Check latest GitHub release is installable
        working-directory: datapan-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../datapan-registry/.datapan/ci
          go run ./cmd/datapan catalog install datapan-registry \
            --registry "${RUNNER_TEMP}/datapan-installed-latest.registry.json" \
            --json \
            > ../datapan-registry/.datapan/ci/latest-release-install.json
          python3 ../datapan-registry/scripts/check-shard-aware-install-smoke.py \
            --summary-json ../datapan-registry/.datapan/ci/latest-release-install-smoke.json \
            ../datapan-registry/.datapan/ci/latest-release-install.json
          ../datapan-registry/.datapan/ci/source-profile-venv/bin/python \
            ../datapan-registry/scripts/validate-install-smoke-summaries.py \
            --schema ../datapan-registry/schemas/datapan.install-smoke-summary.v1.schema.json \
            ../datapan-registry/.datapan/ci/latest-release-install-smoke.json
          DATAPAN_REGISTRY_PATH="${RUNNER_TEMP}/datapan-installed-latest.registry.json" \
            go run ./cmd/datapan doctor --json \
            > ../datapan-registry/.datapan/ci/latest-release-doctor.json
          python3 ../datapan-registry/scripts/check-release-doctor-smoke.py \
            --install-json ../datapan-registry/.datapan/ci/latest-release-install.json \
            --summary-json ../datapan-registry/.datapan/ci/latest-release-doctor-smoke.json \
            ../datapan-registry/.datapan/ci/latest-release-doctor.json
          ../datapan-registry/.datapan/ci/source-profile-venv/bin/python \
            ../datapan-registry/scripts/validate-doctor-smoke-summaries.py \
            --schema ../datapan-registry/schemas/datapan.doctor-smoke-summary.v1.schema.json \
            ../datapan-registry/.datapan/ci/latest-release-doctor-smoke.json
          python3 ../datapan-registry/scripts/generate-release-health-rollup.py \
            --current-install ../datapan-registry/.datapan/ci/current-release-install-smoke.json \
            --current-doctor ../datapan-registry/.datapan/ci/current-release-doctor-smoke.json \
            --latest-install ../datapan-registry/.datapan/ci/latest-release-install-smoke.json \
            --latest-doctor ../datapan-registry/.datapan/ci/latest-release-doctor-smoke.json \
            --output ../datapan-registry/.datapan/ci/release-health-rollup.json
          ../datapan-registry/.datapan/ci/source-profile-venv/bin/python \
            ../datapan-registry/scripts/validate-release-health-rollups.py \
            --schema ../datapan-registry/schemas/datapan.release-health-rollup.v1.schema.json \
            ../datapan-registry/.datapan/ci/release-health-rollup.json

      - name: Upload release health reports
        uses: actions/upload-artifact@v7
        with:
          name: datapan-registry-release-health
          path: datapan-registry/.datapan/ci/
          if-no-files-found: error
