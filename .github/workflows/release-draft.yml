name: Draft registry release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Workflow mode. verify-only checks current artifacts; draft-local regenerates a draft from the checked-in registry."
        required: true
        default: "verify-only"
        type: choice
        options:
          - verify-only
          - draft-local
      registry_path:
        description: "Registry file to verify or draft from."
        required: true
        default: "data/data-go-kr.registry.json"
        type: string
      verification_path:
        description: "Verification evidence to bind into draft-local output."
        required: true
        default: "reports/latest-verification.json"
        type: string
      previous_registry_path:
        description: "Optional previous registry path already present in the checkout."
        required: false
        default: ""
        type: string
      provider_limit:
        description: "Provider report limit passed to release draft."
        required: true
        default: "0"
        type: string
      min_registry_bytes:
        description: "Minimum registry byte size used to catch an unmaterialized LFS pointer."
        required: true
        default: "100000000"
        type: string
      include_shard_archive:
        description: "Generate optional data-go-kr-shards.tar.gz release asset evidence."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@v7
        with:
          path: datapan-registry
          lfs: false

      - name: Materialize manifest-bound canonical registry
        working-directory: datapan-registry
        run: |
          python3 -m unittest tests/test_materialize_canonical_registry.py
          python3 scripts/materialize-canonical-registry.py

      - name: Checkout CLI
        uses: actions/checkout@v7
        with:
          repository: StatPan/datapan-cli
          path: datapan-cli

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: datapan-cli/go.mod
          check-latest: true
          cache-dependency-path: datapan-cli/go.sum

      - name: Confirm registry LFS file is materialized
        working-directory: datapan-registry
        run: |
          bytes="$(wc -c < "${{ inputs.registry_path }}")"
          echo "${{ inputs.registry_path }} bytes=${bytes}"
          test "${bytes}" -gt "${{ inputs.min_registry_bytes }}"

      - name: Validate registry policy artifacts
        working-directory: datapan-registry
        run: |
          mkdir -p .datapan/ci
          python3 -m venv .datapan/ci/source-profile-venv
          . .datapan/ci/source-profile-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install jsonschema
          python -m py_compile \
            scripts/error_action_routing_rollup.py \
            scripts/generate-error-action-routing-rollup.py \
            scripts/generate-failure-recovery-rollup.py \
            scripts/generate-impact-plan-rollup.py \
            scripts/generate-release-assembly-receipt.py \
            scripts/generate-release-distribution-footprint.py \
            scripts/generate-release-shard-consumer-proof.py \
            scripts/generate-release-consumer-compatibility.py \
            scripts/generate-release-operational-pressure.py \
            scripts/generate-release-consumer-decision.py \
            scripts/generate-release-goal-finish-preflight.py \
            scripts/validate-release-goal-pr-boundary.py \
            scripts/generate-release-goal-continuation-queue.py \
            scripts/run-release-goal-continuation-ticket-packet.py \
            scripts/generate-release-goal-operating-contract.py \
            scripts/guard-release-goal-finish.py \
            scripts/refresh-release-ledger-evidence.py \
            scripts/generate-credential-runtime-evidence-policy.py \
            scripts/generate-credential-runtime-collection-preflight.py \
            scripts/generate-credential-runtime-runner-readiness.py \
            scripts/generate-credential-runtime-receipt-collection-queue.py \
            scripts/generate-credential-runtime-review-handoff.py \
            scripts/validate-credential-runtime-manual-review-decision.py \
            scripts/generate-credential-runtime-manual-review-acceptance.py \
            scripts/run-credential-runtime-collection.py \
            scripts/run-credential-runtime-operator-workflow.py \
            scripts/check-credential-runtime-github-secrets.py \
            scripts/promote-credential-runtime-session-review.py \
            scripts/validate-credential-runtime-collection-session.py \
            scripts/generate-credential-runtime-session-review-plan.py \
            scripts/validate-credential-runtime-session-review-plan.py \
            scripts/promote-credential-runtime-receipt.py \
            scripts/validate-credential-runtime-receipts.py \
            scripts/generate-source-runtime-remediation-map.py \
            scripts/generate-release-health-rollup.py \
            scripts/generate-source-contract-rollup.py \
            scripts/generate-sustainable-coverage.py \
            scripts/run-upstream-refresh.py \
            scripts/validate-source-refresh-policy.py \
            scripts/generate-registry-shards.py \
            scripts/package-registry-release.py \
            scripts/package-registry-shards.py \
            scripts/release_health_rollup.py \
            scripts/source_contract_rollup.py \
            scripts/validate-doctor-smoke-summaries.py \
            scripts/validate-error-action-routing-rollups.py \
            scripts/validate-install-smoke-summaries.py \
            scripts/validate-release-consumer-compatibility.py \
            scripts/sync-release-manifest-artifacts.py \
            scripts/validate-release-ledger-ownership.py \
            scripts/validate-release-ledger-goal-audit.py \
            scripts/validate-release-report-artifacts.py \
            scripts/validate-release-receipt-boundary.py \
            scripts/validate-release-health-rollups.py \
            scripts/validate-source-contract-rollups.py \
            scripts/validate-registry-shards.py
          python scripts/sync-release-schema-artifacts.py --check
          python scripts/sync-release-manifest-artifacts.py --check
          python scripts/validate-release-ledger-ownership.py
          python scripts/validate-release-ledger-goal-audit.py
          python scripts/generate-release-goal-finish-preflight.py --check
          python scripts/validate-release-goal-pr-boundary.py --self-test
          python scripts/validate-release-goal-pr-boundary.py --check
          python scripts/generate-release-goal-continuation-queue.py --check
          python scripts/run-release-goal-continuation-ticket-packet.py --self-test
          python scripts/generate-release-goal-operating-contract.py --check
          python scripts/guard-release-goal-finish.py --self-test
          python scripts/refresh-release-ledger-evidence.py --self-test
          python scripts/refresh-release-ledger-evidence.py --check
          python scripts/generate-release-assembly-receipt.py --check
          python scripts/validate-coverage-backlog.py
          python scripts/validate-external-adapter-backlog.py
          python scripts/validate-source-profiles.py
          python scripts/validate-source-refresh-policy.py
          python -m unittest tests/test_run_upstream_refresh.py
          python -m unittest tests/test_sync_release_manifest_artifacts.py
          python scripts/generate-source-contract-rollup.py --check
          python scripts/validate-source-contract-rollups.py
          python scripts/validate-error-action-catalogs.py
          python scripts/generate-error-action-routing-rollup.py --check
          python scripts/validate-error-action-routing-rollups.py
          python scripts/generate-failure-recovery-rollup.py --check
          python -m unittest tests/test_generate_failure_recovery_rollup.py
          python scripts/validate-external-coverage.py
          python scripts/generate-impact-plan-rollup.py --check
          python scripts/validate-impact-plans.py
          python scripts/validate-source-reference-drift.py
          python scripts/validate-source-report-inventory.py
          python scripts/validate-release-report-artifacts.py
          python scripts/validate-release-receipt-boundary.py
          python scripts/validate-source-runtime-candidates.py
          python scripts/validate-source-runtime-evidence-plans.py
          python scripts/validate-source-runtime-evidence-rollup.py
          python scripts/validate-runtime-evidence-growth.py
          python scripts/generate-sustainable-coverage.py --self-test
          python scripts/generate-sustainable-coverage.py --check
          python scripts/validate-operation-materialization-plan.py
          python scripts/validate-safetydata-operation-candidates.py
          python scripts/validate-safetydata-registry-patches.py
          python scripts/validate-link-detail-registry-patches.py
          python scripts/validate-institution-api-overview.py
          python scripts/validate-institution-runtime-plan.py
          python scripts/generate-source-runtime-remediation-map.py --check
          python scripts/generate-credential-runtime-evidence-policy.py --check
          python scripts/generate-credential-runtime-collection-preflight.py --check
          python scripts/generate-credential-runtime-runner-readiness.py --check
          python scripts/validate-credential-runtime-receipts.py
          python scripts/generate-credential-runtime-receipt-collection-queue.py --check
          python scripts/generate-credential-runtime-review-handoff.py --check
          python scripts/generate-credential-runtime-operator-packets.py --check
          python scripts/validate-credential-runtime-manual-review-decision.py
          python scripts/generate-credential-runtime-manual-review-acceptance.py --check
          python scripts/generate-credential-runtime-manual-review-acceptance-packet.py --check
          python scripts/run-credential-runtime-collection.py --self-test
          python scripts/run-credential-runtime-collection.py --check
          python scripts/run-credential-runtime-operator-workflow.py --self-test
          python scripts/run-credential-runtime-operator-workflow.py --check
          python scripts/check-credential-runtime-github-secrets.py --self-test
          python scripts/check-credential-runtime-github-secrets.py --check
          python scripts/promote-credential-runtime-session-review.py --self-test
          python scripts/promote-credential-runtime-session-review.py --check
          python scripts/validate-credential-runtime-collection-session.py --self-test
          python scripts/generate-credential-runtime-session-review-plan.py --self-test
          python scripts/validate-credential-runtime-session-review-plan.py --self-test
          python scripts/promote-credential-runtime-receipt.py --self-test
          python scripts/generate-release-distribution-footprint.py --check
          python scripts/generate-release-shard-consumer-proof.py --check
          python scripts/generate-release-consumer-compatibility.py --check
          python scripts/validate-release-consumer-compatibility.py
          python -m unittest tests/test_studio_consumer_compatibility.py
          python scripts/generate-release-operational-pressure.py --check
          python scripts/generate-release-consumer-decision.py --check

      - name: Select manifest path
        run: |
          if [ "${{ inputs.mode }}" = "draft-local" ]; then
            echo "DATAPAN_RELEASE_MANIFEST=../datapan-registry/.datapan/draft/manifest.json" >> "${GITHUB_ENV}"
          else
            echo "DATAPAN_RELEASE_MANIFEST=../datapan-registry/manifest.json" >> "${GITHUB_ENV}"
          fi

      - name: Generate local release draft
        if: inputs.mode == 'draft-local'
        working-directory: datapan-cli
        run: |
          mkdir -p ../datapan-registry/.datapan/draft
          args=(
            catalog release draft
            --registry "../datapan-registry/${{ inputs.registry_path }}"
            --verification "../datapan-registry/${{ inputs.verification_path }}"
            --output-dir ../datapan-registry/.datapan/draft
            --provider-limit "${{ inputs.provider_limit }}"
            --json
          )
          if [ -n "${{ inputs.previous_registry_path }}" ]; then
            args+=(--previous-registry "../datapan-registry/${{ inputs.previous_registry_path }}")
          fi
          go run ./cmd/datapan "${args[@]}"

      - name: Verify selected release manifest
        working-directory: datapan-cli
        run: |
          mkdir -p ../datapan-registry/.datapan/ci
          go run ./cmd/datapan catalog release verify \
            --manifest "${DATAPAN_RELEASE_MANIFEST}" \
            --output ../datapan-registry/.datapan/ci/latest-release-verification.json \
            --json

      - name: Check selected release readiness
        working-directory: datapan-cli
        run: |
          go run ./cmd/datapan catalog release readiness \
            --manifest "${DATAPAN_RELEASE_MANIFEST}" \
            --output ../datapan-registry/.datapan/ci/latest-release-readiness.json \
            --json

      - name: Package release zip asset evidence
        working-directory: datapan-registry
        run: |
          mkdir -p .datapan/release-assets
          python scripts/package-registry-release.py \
            --manifest "${DATAPAN_RELEASE_MANIFEST#../datapan-registry/}" \
            --output .datapan/release-assets/datapan-registry-snapshot.zip
          python scripts/package-registry-release.py \
            --check .datapan/release-assets/datapan-registry-snapshot.zip \
            | tee .datapan/ci/release-zip-check.txt

      - name: Generate shard archive release evidence
        if: inputs.include_shard_archive
        working-directory: datapan-registry
        run: |
          . .datapan/ci/source-profile-venv/bin/activate
          mkdir -p .datapan/release-assets
          python scripts/generate-registry-shards.py \
            --source-registry "${{ inputs.registry_path }}" \
            --output-dir .datapan/ci/registry-shards \
            --manifest "${DATAPAN_RELEASE_MANIFEST#../datapan-registry/}" \
            --generated-at "$(jq -r '.generated_at' "${DATAPAN_RELEASE_MANIFEST#../datapan-registry/}")" \
            --clean
          python scripts/validate-registry-shards.py \
            .datapan/ci/registry-shards/registry-shards.json
          python scripts/package-registry-shards.py \
            --shard-dir .datapan/ci/registry-shards \
            --output .datapan/release-assets/data-go-kr-shards.tar.gz
          python scripts/package-registry-shards.py \
            --check .datapan/release-assets/data-go-kr-shards.tar.gz \
            | tee .datapan/ci/shard-archive-check.txt
          python scripts/package-registry-release.py \
            --check .datapan/release-assets/datapan-registry-snapshot.zip \
            --shard-archive .datapan/release-assets/data-go-kr-shards.tar.gz \
            | tee .datapan/ci/release-asset-consistency-check.txt

      - name: Write workflow summary
        run: |
          {
            echo "## Registry release draft"
            echo
            echo "- mode: \`${{ inputs.mode }}\`"
            echo "- registry: \`${{ inputs.registry_path }}\`"
            echo "- manifest: \`${DATAPAN_RELEASE_MANIFEST}\`"
            echo "- release zip: \`.datapan/release-assets/datapan-registry-snapshot.zip\`"
            if [ "${{ inputs.include_shard_archive }}" = "true" ]; then
              echo "- shard archive: \`.datapan/release-assets/data-go-kr-shards.tar.gz\`"
            else
              echo "- shard archive: \`disabled\`"
            fi
            echo "- publish: disabled"
            echo
            echo "This workflow does not push commits, tags, or GitHub Releases."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload draft artifacts
        uses: actions/upload-artifact@v7
        with:
          name: datapan-registry-draft
          path: |
            datapan-registry/.datapan/draft/
            datapan-registry/.datapan/ci/
            datapan-registry/.datapan/release-assets/
          if-no-files-found: error
