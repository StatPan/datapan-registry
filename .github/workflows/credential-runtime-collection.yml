name: Credential runtime collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Workflow mode. preflight plans only; collect requires repository credential secrets."
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - collect

permissions:
  contents: read

jobs:
  secret-readiness:
    runs-on: ubuntu-latest
    env:
      DATAPAN_DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATAPAN_DATA_GO_KR_SERVICE_KEY }}
      DATAPAN_ECOS_API_KEY: ${{ secrets.DATAPAN_ECOS_API_KEY }}
      DATAPAN_KOSIS_API_KEY: ${{ secrets.DATAPAN_KOSIS_API_KEY }}
      DATAPAN_OPEN_ASSEMBLY_API_KEY: ${{ secrets.DATAPAN_OPEN_ASSEMBLY_API_KEY }}
      DATAPAN_SEOUL_OPEN_DATA_API_KEY: ${{ secrets.DATAPAN_SEOUL_OPEN_DATA_API_KEY }}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Check credential secrets
        id: gate
        run: |
          mkdir -p credential-runtime-secret-readiness
          python3 - <<'PY'
          import json
          import os

          required = [
              "DATAPAN_DATA_GO_KR_SERVICE_KEY",
              "DATAPAN_ECOS_API_KEY",
              "DATAPAN_KOSIS_API_KEY",
              "DATAPAN_OPEN_ASSEMBLY_API_KEY",
              "DATAPAN_SEOUL_OPEN_DATA_API_KEY",
          ]
          present = [name for name in required if os.environ.get(name)]
          missing = [name for name in required if name not in present]
          report = {
              "schema_version": "datapan.credential-runtime-github-secret-readiness.v1",
              "required_credential_envs": required,
              "present_credential_envs": present,
              "missing_credential_envs": missing,
              "required_credential_env_count": len(required),
              "present_credential_env_count": len(present),
              "missing_credential_env_count": len(missing),
              "current_operator_env_ready": not missing,
              "secret_values_included": False,
          }
          path = "credential-runtime-secret-readiness/github-secret-readiness.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"ready={str(not missing).lower()}\n")
          if missing and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write("## Credential secret readiness\n\n")
                  handle.write("- ready: `false`\n")
                  handle.write("- missing: `" + "`, `".join(missing) + "`\n")
                  handle.write("- secret values included: `false`\n")
          if missing and os.environ.get("INPUT_MODE") == "collect":
              raise SystemExit(1)
          PY
        env:
          INPUT_MODE: ${{ inputs.mode }}

      - name: Upload secret readiness
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: credential-runtime-secret-readiness
          path: credential-runtime-secret-readiness/
          if-no-files-found: warn
          retention-days: 14

  credential-runtime-collection:
    runs-on: ubuntu-latest
    needs: secret-readiness
    if: inputs.mode != 'collect' || needs.secret-readiness.outputs.ready == 'true'
    env:
      DATAPAN_DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATAPAN_DATA_GO_KR_SERVICE_KEY }}
      DATAPAN_ECOS_API_KEY: ${{ secrets.DATAPAN_ECOS_API_KEY }}
      DATAPAN_KOSIS_API_KEY: ${{ secrets.DATAPAN_KOSIS_API_KEY }}
      DATAPAN_OPEN_ASSEMBLY_API_KEY: ${{ secrets.DATAPAN_OPEN_ASSEMBLY_API_KEY }}
      DATAPAN_SEOUL_OPEN_DATA_API_KEY: ${{ secrets.DATAPAN_SEOUL_OPEN_DATA_API_KEY }}
    steps:
      - name: Checkout registry
        uses: actions/checkout@v7
        with:
          path: datapan-registry
          lfs: true

      - name: Checkout CLI
        uses: actions/checkout@v7
        with:
          repository: StatPan/datapan-cli
          path: datapan-cli

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: datapan-cli/go.mod
          check-latest: true
          cache-dependency-path: datapan-cli/go.sum

      - name: Build datapan CLI
        working-directory: datapan-cli
        run: |
          mkdir -p ../datapan-registry/.datapan/ci/bin
          go build -o ../datapan-registry/.datapan/ci/bin/datapan ./cmd/datapan
          echo "${GITHUB_WORKSPACE}/datapan-registry/.datapan/ci/bin" >> "${GITHUB_PATH}"

      - name: Setup Python
        working-directory: datapan-registry
        run: |
          python3 -m venv .datapan/ci/credential-runtime-venv
          . .datapan/ci/credential-runtime-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Write operator workflow plan
        working-directory: datapan-registry
        run: |
          . .datapan/ci/credential-runtime-venv/bin/activate
          mkdir -p .datapan/runtime-evidence
          python scripts/run-credential-runtime-operator-workflow.py --json \
            | tee .datapan/runtime-evidence/credential-runtime-operator-workflow-plan.json

      - name: Require credential environment
        if: inputs.mode == 'collect'
        working-directory: datapan-registry
        run: |
          set -o pipefail
          . .datapan/ci/credential-runtime-venv/bin/activate
          python scripts/run-credential-runtime-operator-workflow.py --require-env --json \
            | tee .datapan/runtime-evidence/credential-runtime-operator-env-gate.json

      - name: Run credential collection workflow
        if: inputs.mode == 'collect'
        working-directory: datapan-registry
        run: |
          set -o pipefail
          . .datapan/ci/credential-runtime-venv/bin/activate
          python scripts/run-credential-runtime-operator-workflow.py --run --json \
            | tee .datapan/runtime-evidence/credential-runtime-operator-workflow-run.json

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Credential runtime collection"
            echo
            echo "- mode: \`${{ inputs.mode }}\`"
            echo "- local evidence: \`datapan-registry/.datapan/runtime-evidence/\`"
            echo "- checked-in receipt promotion: disabled"
            echo "- secret values in artifacts: disabled by operator workflow contract"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload local runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: credential-runtime-evidence
          path: datapan-registry/.datapan/runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
