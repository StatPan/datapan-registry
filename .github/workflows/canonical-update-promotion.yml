name: Canonical update promotion

on:
  workflow_run:
    workflows: ["Process upstream catalogue"]
    types: [completed]
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      refresh_pr_number:
        description: Existing adopted canonical PR to refresh
        required: false
        type: string
        default: ""
      expected_predecessor_head_sha:
        description: Exact predecessor candidate head SHA
        required: false
        type: string
        default: ""
      expected_predecessor_body_sha256:
        description: Exact predecessor PR body SHA-256
        required: false
        type: string
        default: ""
      expected_predecessor_manifest_sha256:
        description: Exact predecessor release manifest SHA-256
        required: false
        type: string
        default: ""
      target_main_sha:
        description: Exact trusted default-branch target SHA
        required: false
        type: string
        default: ""
      processor_state_sha:
        description: Exact historical processor-state commit on the authoritative B state branch
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: canonical-update-promotion
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Process upstream catalogue' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
    steps:
      - name: Check out the current trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Check whether durable processor state exists
        id: processor-state-branch
        run: |
          set -euo pipefail
          state_ref="$(git ls-remote --heads origin refs/heads/automation/upstream-catalogue-state)"
          if [ -n "$state_ref" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out durable upstream catalogue processor state
        if: steps.processor-state-branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: automation/upstream-catalogue-state
          path: .datapan/processor-state
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: StatPan/datapan-cli
          ref: e3b2fa44cb0f68d7e58e003fbd71ecde505878de
          path: .datapan/datapan-cli
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version-file: .datapan/datapan-cli/go.mod
          check-latest: true
          cache-dependency-path: .datapan/datapan-cli/go.sum

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema 'PyYAML==6.0.2'

      - name: Reconcile owned PRs and exact-head CI
        if: >-
          github.event_name != 'workflow_dispatch' ||
          (inputs.refresh_pr_number == '' && inputs.expected_predecessor_head_sha == '' && inputs.expected_predecessor_body_sha256 == '' && inputs.expected_predecessor_manifest_sha256 == '' && inputs.target_main_sha == '' && inputs.processor_state_sha == '')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 scripts/run-canonical-update-promotion.py --mode reconcile-prs

      - name: Refresh one explicitly bound owned source revision
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.refresh_pr_number != '' || inputs.expected_predecessor_head_sha != '' || inputs.expected_predecessor_body_sha256 != '' || inputs.expected_predecessor_manifest_sha256 != '' || inputs.target_main_sha != '' || inputs.processor_state_sha != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REFRESH_PR_NUMBER: ${{ inputs.refresh_pr_number }}
          EXPECTED_PREDECESSOR_HEAD_SHA: ${{ inputs.expected_predecessor_head_sha }}
          EXPECTED_PREDECESSOR_BODY_SHA256: ${{ inputs.expected_predecessor_body_sha256 }}
          EXPECTED_PREDECESSOR_MANIFEST_SHA256: ${{ inputs.expected_predecessor_manifest_sha256 }}
          TARGET_MAIN_SHA: ${{ inputs.target_main_sha }}
          PROCESSOR_STATE_SHA: ${{ inputs.processor_state_sha }}
        run: |
          python3 scripts/run-canonical-update-promotion.py \
            --mode refresh-owned-source \
            --state-root .datapan/processor-state/.datapan/upstream-catalogue-state \
            --datapan-cli .datapan/datapan-cli \
            --refresh-pr-number "$REFRESH_PR_NUMBER" \
            --expected-predecessor-head-sha "$EXPECTED_PREDECESSOR_HEAD_SHA" \
            --expected-predecessor-body-sha256 "$EXPECTED_PREDECESSOR_BODY_SHA256" \
            --expected-predecessor-manifest-sha256 "$EXPECTED_PREDECESSOR_MANIFEST_SHA256" \
            --target-main-sha "$TARGET_MAIN_SHA" \
            --processor-state-repo .datapan/processor-state \
            --processor-state-sha "$PROCESSOR_STATE_SHA"

      - name: Recover at most one durable ready processor bundle
        if: >-
          steps.processor-state-branch.outputs.exists == 'true' &&
          (github.event_name != 'workflow_dispatch' || (inputs.refresh_pr_number == '' && inputs.expected_predecessor_head_sha == '' && inputs.expected_predecessor_body_sha256 == '' && inputs.expected_predecessor_manifest_sha256 == '' && inputs.target_main_sha == '' && inputs.processor_state_sha == ''))
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 scripts/run-canonical-update-promotion.py \
            --mode recover-ready \
            --state-root .datapan/processor-state/.datapan/upstream-catalogue-state \
            --datapan-cli .datapan/datapan-cli \
            --event-run-id "$EVENT_RUN_ID" \
            --event-run-attempt "$EVENT_RUN_ATTEMPT" \
            --event-head-sha "$EVENT_HEAD_SHA"
